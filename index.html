<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智庫管家 Pro - 零件拍照自動建檔與智能歸位</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #151d2e;
            --card-inner: #0d131f;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-ui: #222f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .mobile-shell {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            padding-bottom: 24px;
            position: relative;
        }

        /* Top Bar */
        .app-bar {
            padding: 14px 18px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-ui);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .app-title-group h1 {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .app-title-group p {
            font-size: 0.72rem;
            color: var(--text-sub);
        }

        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .admin-btn {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .admin-btn.logged-in {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* Camera / Preview Area */
        .cam-frame {
            position: relative;
            margin: 12px 16px 8px;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4 / 3;
            border: 1.5px solid var(--border-ui);
        }

        #mobileVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #previewImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #simCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #070b12;
        }

        .scan-overlay {
            position: absolute;
            inset: 16px;
            border: 1.5px dashed rgba(6, 182, 212, 0.5);
            border-radius: 12px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }

        .scan-laser-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-cyan);
            animation: moveLaser 2.2s infinite ease-in-out alternate;
        }

        @keyframes moveLaser {
            0% { top: 8%; opacity: 0.2; }
            50% { opacity: 1; }
            100% { top: 92%; opacity: 0.2; }
        }

        .cam-tools {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
        }

        .tool-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-ui);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            cursor: pointer;
        }

        /* Result Panel */
        .info-container {
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-ui);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .part-details {
            flex: 1;
        }

        .conf-badge {
            font-size: 0.7rem;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .part-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
        }

        .part-desc {
            font-size: 0.78rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .drawer-box-indicator {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(6, 182, 212, 0.15));
            border: 2px solid var(--accent-green);
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
            min-width: 90px;
        }

        .drawer-box-label {
            font-size: 0.65rem;
            color: var(--accent-green);
            font-weight: 700;
        }

        .drawer-box-id {
            font-size: 1.6rem;
            font-weight: 900;
            color: #fff;
            font-family: monospace;
        }

        /* Drawer Mini Grid */
        .matrix-section {
            background: var(--card-inner);
            border: 1px solid var(--border-ui);
            border-radius: 14px;
            padding: 12px;
        }

        .drawer-grid-mini {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 8px;
            max-height: 160px;
            overflow-y: auto;
        }

        .mini-cell {
            background: #141c2c;
            border: 1px solid var(--border-ui);
            border-radius: 6px;
            padding: 6px 4px;
            text-align: center;
            transition: all 0.2s;
        }

        .mini-cell .cid {
            font-size: 0.68rem;
            font-family: monospace;
            font-weight: 700;
            color: var(--text-sub);
        }

        .mini-cell .cname {
            font-size: 0.62rem;
            color: #e2e8f0;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-cell.active-drawer {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
        .mini-cell.active-drawer .cid {
            color: var(--accent-green);
        }

        /* Action bottom */
        .bottom-actions {
            margin-top: auto;
            padding: 12px 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .demo-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .demo-select {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-ui);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
        }

        .action-row-buttons {
            display: flex;
            gap: 8px;
        }

        .main-scan-btn {
            flex: 1;
            background: linear-gradient(135deg, #0284c7, #06b6d4);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .quick-upload-btn {
            background: rgba(16, 185, 129, 0.18);
            border: 1.5px solid var(--accent-green);
            color: var(--accent-green);
            padding: 0 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Modal Dialogs */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-panel {
            background: #151d2e;
            border: 1.5px solid var(--border-ui);
            border-radius: 16px;
            width: 100%;
            max-width: 460px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.76rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .text-input, .select-input {
            background: #090d16;
            border: 1px solid var(--border-ui);
            border-radius: 8px;
            padding: 9px 12px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        .text-input:focus, .select-input:focus {
            border-color: var(--accent-cyan);
        }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7, #06b6d4);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Image Upload Box inside Create Modal */
        .image-drop-area {
            border: 2px dashed var(--accent-cyan);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            background: rgba(6, 182, 212, 0.05);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        #imgThumbnailPreview {
            width: 100%;
            max-height: 130px;
            object-fit: contain;
            border-radius: 8px;
            display: none;
        }

        .auto-tag {
            font-size: 0.72rem;
            color: var(--accent-amber);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="mobile-shell">
        <!-- Top Bar -->
        <header class="app-bar">
            <div class="app-title-group">
                <h1>智庫管家 <span>Pro</span></h1>
                <p>AI 自動辨識與零件拍照建檔</p>
            </div>
            <div class="nav-actions">
                <button class="admin-btn" id="adminToggleBtn" onclick="handleAdminBtnClick()">
                    🔐 管理員登入
                </button>
            </div>
        </header>

        <!-- Camera / Photo Viewport -->
        <div class="cam-frame">
            <video id="mobileVideo" autoplay playsinline muted></video>
            <img id="previewImg" alt="零件照片">
            <canvas id="simCanvas" width="480" height="360"></canvas>

            <div class="scan-overlay">
                <div style="font-size:0.7rem; color:var(--accent-cyan); font-family:monospace;" id="dbStatusBadge">
                    DB_RECORDS: 6 元件已就緒
                </div>
                <div class="scan-laser-line"></div>
                <div style="font-size:0.7rem; color:var(--accent-green); font-family:monospace; align-self:flex-end;">AUTO_VOICE: ON</div>
            </div>

            <div class="cam-tools">
                <button class="tool-btn" onclick="openPhotoUploadModal()">📸 上傳新零件照片</button>
                <button class="tool-btn" onclick="toggleRealCam()">📷 鏡頭切換</button>
            </div>
        </div>

        <!-- Result Box -->
        <div class="info-container">
            <div class="result-card">
                <div class="part-details">
                    <span class="conf-badge" id="mConfBadge">CONFIDENCE 98.4%</span>
                    <h2 class="part-name" id="mPartName">10kΩ 四環電阻</h2>
                    <p class="part-desc" id="mPartDesc">色碼：棕 · 黑 · 橙 · 金 (±5%)</p>
                    <p style="font-size:0.75rem; color:#38bdf8; margin-top:6px;" id="mVoiceHint">🔊 自動播報：「請放入 A 區 3 號盒」</p>
                </div>
                <div class="drawer-box-indicator">
                    <div class="drawer-box-label">建議盒號</div>
                    <div class="drawer-box-id" id="mDrawerId">A-03</div>
                </div>
            </div>

            <!-- Warehouse Grid -->
            <div class="matrix-section">
                <div style="font-size:0.75rem; color:var(--text-sub); display:flex; justify-content:space-between;">
                    <span>🗄️ 實習工場抽屜櫃座標矩陣</span>
                    <span style="color:var(--accent-green);" id="activeBoxStatus">🟢 A-03 閃爍中</span>
                </div>
                <div class="drawer-grid-mini" id="miniDrawerGrid"></div>
            </div>
        </div>

        <!-- Bottom Actions -->
        <div class="bottom-actions">
            <div class="demo-bar">
                <span>選擇零件檢視：</span>
                <select class="demo-select" id="partPick" onchange="autoRecognizeAndSpeak(this.value)">
                </select>
            </div>
            <div class="action-row-buttons">
                <button class="main-scan-btn" onclick="triggerScanNow()">
                    <span>⚡ 立即歸位與自動播報</span>
                </button>
                <button class="quick-upload-btn" onclick="openPhotoUploadModal()">
                    <span>➕ 拍照建檔</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal 1: Login Dialog -->
    <div class="modal-backdrop" id="loginModal">
        <div class="modal-panel">
            <div class="modal-header">
                <div class="modal-title">🔐 庫房管理員登入</div>
                <button class="close-btn" onclick="closeModal('loginModal')">✕</button>
            </div>
            <div class="input-group">
                <label>管理員帳號 (預設: admin)</label>
                <input type="text" class="text-input" id="loginUser" placeholder="請輸入帳號" value="admin">
            </div>
            <div class="input-group">
                <label>登入密碼 (預設: 123456)</label>
                <input type="password" class="text-input" id="loginPass" placeholder="請輸入密碼" value="123456">
            </div>
            <button class="btn-submit" onclick="submitLogin()">驗證並進入建檔系統</button>
        </div>
    </div>

    <!-- Modal 2: Upload Photo & Auto-Numbering Dialog -->
    <div class="modal-backdrop" id="uploadModal">
        <div class="modal-panel">
            <div class="modal-header">
                <div class="modal-title">📸 零件拍照上傳 ＆ 自動設編號</div>
                <button class="close-btn" onclick="closeModal('uploadModal')">✕</button>
            </div>

            <!-- Upload Photo Dropzone -->
            <div class="image-drop-area" onclick="document.getElementById('partImageFile').click()">
                <img id="imgThumbnailPreview" alt="預覽圖">
                <div id="dropPlaceholder">
                    <div style="font-size:1.8rem;">📷</div>
                    <div style="font-weight:700; font-size:0.85rem; color:var(--accent-cyan);">點擊拍照或上傳零件圖片</div>
                    <div style="font-size:0.7rem; color:var(--text-sub);">支援手機相機現拍或相簿選取 (JPG, PNG)</div>
                </div>
                <input type="file" id="partImageFile" accept="image/*" capture="environment" style="display:none;" onchange="handlePartImageSelected(event)">
            </div>

            <!-- Custom Name -->
            <div class="input-group">
                <label>零件自訂名稱 (必填)</label>
                <input type="text" class="text-input" id="newPartName" placeholder="例如：SG90 伺服馬達 / 0.1uF 陶瓷電容">
            </div>

            <!-- Select Region / Area -->
            <div class="input-group">
                <label>存放區域 (請選擇工場庫房分區)</label>
                <select class="select-input" id="newPartArea" onchange="calculateAutoBoxNumber()">
                    <option value="A">A 區 (電阻 / 基礎被動元件櫃)</option>
                    <option value="B">B 區 (二極體 / LED / 電解電容櫃)</option>
                    <option value="C">C 區 (IC 晶片 / 感測器模組櫃)</option>
                    <option value="D">D 區 (繼電器 / 馬達動力元件櫃)</option>
                </select>
            </div>

            <!-- Auto Number Box Indicator -->
            <div class="input-group">
                <label style="display:flex; justify-content:space-between;">
                    <span>系統自動分配編號 (建議盒號)</span>
                    <span class="auto-tag">⚡ 自動依區域序號遞增</span>
                </label>
                <input type="text" class="text-input" id="newPartBox" style="color:var(--accent-green); font-weight:800; font-family:monospace;" readonly>
            </div>

            <!-- Custom Specs / Desc -->
            <div class="input-group">
                <label>規格與防呆提醒備註</label>
                <input type="text" class="text-input" id="newPartDesc" placeholder="例如：工作電壓 5V，注意紅正黑負">
            </div>

            <button class="btn-submit" onclick="saveNewPartToDB()">💾 完成建檔並同步資料庫</button>
        </div>
    </div>

    <!-- Modal 3: Database JSON/CSV Management -->
    <div class="modal-backdrop" id="adminModal">
        <div class="modal-panel">
            <div class="modal-header">
                <div class="modal-title">🗄️ 零件資料庫備份與管理</div>
                <button class="close-btn" onclick="closeModal('adminModal')">✕</button>
            </div>
            <div style="font-size:0.75rem; color:var(--accent-green);" id="adminDbStat">目前零件庫共 6 筆資料</div>
            
            <button class="btn-submit" style="background:#0284c7;" onclick="closeModal('adminModal'); openPhotoUploadModal();">
                📸 新增零件 (上傳圖片自動配號)
            </button>

            <div style="display:flex; justify-content:space-between; gap:10px;">
                <button class="admin-btn" style="flex:1;" onclick="exportDatabaseJSON()">📥 備份 JSON</button>
                <button class="admin-btn" style="flex:1; border-color:var(--accent-rose); color:var(--accent-rose);" onclick="resetDefaultDB()">🔄 還原預設</button>
            </div>
            <button class="btn-submit" style="background:#334155;" onclick="logoutAdmin()">登出管理員身分</button>
        </div>
    </div>

    <script>
        // Preset default database
        const DEFAULT_DB = {
            "resistor_10k": { name: "10kΩ 四環電阻", desc: "色碼：棕 · 黑 · 橙 · 金 (±5%)", box: "A-03", area: "A", conf: "98.4%", type: "resistor", speech: "辨識完成，10k歐姆電阻，請放入A區3號盒。" },
            "resistor_220": { name: "220Ω 四環電阻", desc: "色碼：紅 · 紅 · 棕 · 金 (±5%)", box: "A-01", area: "A", conf: "97.1%", type: "resistor", speech: "辨識完成，220歐姆限流電阻，請放入A區1號盒。" },
            "led_red": { name: "5mm 紅色 LED", desc: "長正短負 / 順向電壓約 2V", box: "B-02", area: "B", conf: "99.2%", type: "led", speech: "偵測到紅色發光二極體，長腳為正極，請放入B區2號盒。" },
            "cap_electrolytic": { name: "100µF 電解電容", desc: "有極性！灰條標示為負極(-)", box: "B-04", area: "B", conf: "96.5%", type: "cap_elec", speech: "注意！100微法拉電解電容，有正負極區分，請放入B區4號盒。" },
            "cap_ceramic": { name: "104 陶瓷電容", desc: "無極性 / 容值 0.1µF 去耦電容", box: "C-01", area: "C", conf: "95.8%", type: "cap_cer", speech: "104陶瓷去耦電容，請歸入C區1號盒。" },
            "ic_ne555": { name: "NE555 定時 IC", desc: "DIP-8 封裝 / 缺口左側為第1腳", box: "C-03", area: "C", conf: "98.9%", type: "ic", speech: "NE555定時IC，請注意引腳方向，放入C區3號IC盒。" }
        };

        let currentDB = JSON.parse(localStorage.getItem("zhiku_custom_db")) || DEFAULT_DB;
        let isAdminLoggedIn = localStorage.getItem("zhiku_admin_logged") === "true";
        let curKey = Object.keys(currentDB)[0] || "resistor_10k";
        let isRealCam = false;
        let uploadedBase64Img = "";

        // Refresh UI
        function refreshUIState() {
            const btn = document.getElementById("adminToggleBtn");
            if (isAdminLoggedIn) {
                btn.className = "admin-btn logged-in";
                btn.innerHTML = "⚙️ 庫房後台 (已登入)";
            } else {
                btn.className = "admin-btn";
                btn.innerHTML = "🔐 管理員登入";
            }

            const total = Object.keys(currentDB).length;
            document.getElementById("dbStatusBadge").textContent = `DB_RECORDS: ${total} 元件已就緒`;
            document.getElementById("adminDbStat").textContent = `目前零件庫共 ${total} 筆資料 (已同步瀏覽器快取)`;

            const sel = document.getElementById("partPick");
            sel.innerHTML = "";
            for (let k in currentDB) {
                const opt = document.createElement("option");
                opt.value = k;
                opt.textContent = `${currentDB[k].name} ➜ ${currentDB[k].box}`;
                sel.appendChild(opt);
            }
            if (!currentDB[curKey]) {
                curKey = Object.keys(currentDB)[0];
            }
            sel.value = curKey;
        }

        // Generate Drawer Grid dynamically based on database boxes
        function initGrid() {
            const grid = document.getElementById("miniDrawerGrid");
            grid.innerHTML = "";

            // Gather all used boxes plus standard coordinates
            let boxMap = {};
            for (let k in currentDB) {
                boxMap[currentDB[k].box] = currentDB[k].name;
            }
            // Ensure default baseline exists
            ["A-01", "A-02", "A-03", "A-04", "B-01", "B-02", "B-03", "B-04", "C-01", "C-02", "C-03", "C-04"].forEach(b => {
                if (!boxMap[b]) boxMap[b] = "備用空盒";
            });

            const sortedBoxes = Object.keys(boxMap).sort();
            sortedBoxes.forEach(bId => {
                const cell = document.createElement("div");
                cell.className = "mini-cell" + (bId === (currentDB[curKey]?.box || "A-03") ? " active-drawer" : "");
                cell.id = "m-cell-" + bId;
                cell.innerHTML = `<span class="cid">${bId}</span><span class="cname">${boxMap[bId]}</span>`;
                grid.appendChild(cell);
            });
        }

        // Auto Numbering Calculation
        function calculateAutoBoxNumber() {
            const area = document.getElementById("newPartArea").value; // 'A', 'B', 'C', 'D'
            let maxIndex = 0;

            for (let k in currentDB) {
                const b = currentDB[k].box || "";
                if (b.startsWith(area + "-")) {
                    const numPart = parseInt(b.split("-")[1], 10);
                    if (!isNaN(numPart) && numPart > maxIndex) {
                        maxIndex = numPart;
                    }
                }
            }
            const nextIndex = maxIndex + 1;
            const autoCode = `${area}-${nextIndex < 10 ? '0' + nextIndex : nextIndex}`;
            document.getElementById("newPartBox").value = autoCode;
        }

        // Open Upload Modal (with admin gate check)
        function openPhotoUploadModal() {
            if (!isAdminLoggedIn) {
                alert("建立新零件需庫房管理員權限，請先登入！(預設: admin / 123456)");
                document.getElementById("loginModal").style.display = "flex";
                return;
            }
            // Reset fields
            document.getElementById("newPartName").value = "";
            document.getElementById("newPartDesc").value = "";
            document.getElementById("imgThumbnailPreview").style.display = "none";
            document.getElementById("dropPlaceholder").style.display = "block";
            uploadedBase64Img = "";
            calculateAutoBoxNumber();
            document.getElementById("uploadModal").style.display = "flex";
        }

        // Image Selection Handler (Converts to Base64)
        function handlePartImageSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedBase64Img = e.target.result;
                const thumb = document.getElementById("imgThumbnailPreview");
                thumb.src = uploadedBase64Img;
                thumb.style.display = "block";
                document.getElementById("dropPlaceholder").style.display = "none";

                // Auto suggest name if empty
                const fileNameClean = file.name.replace(/\.[^/.]+$/, "");
                const nameInput = document.getElementById("newPartName");
                if (!nameInput.value.trim() && fileNameClean && !fileNameClean.startsWith("image")) {
                    nameInput.value = fileNameClean;
                }
            };
            reader.readAsDataURL(file);
        }

        // Save New Part to Database
        function saveNewPartToDB() {
            const name = document.getElementById("newPartName").value.trim();
            const area = document.getElementById("newPartArea").value;
            const box = document.getElementById("newPartBox").value;
            const desc = document.getElementById("newPartDesc").value.trim() || `存放於 ${area} 區之零件`;

            if (!name) {
                alert("請填寫零件自訂名稱！");
                return;
            }

            const newKey = "part_" + Date.now();
            currentDB[newKey] = {
                name: name,
                desc: desc,
                box: box,
                area: area,
                conf: "99.0%",
                img: uploadedBase64Img || null,
                speech: `辨識完成，${name}，請放入${area}區${parseInt(box.split("-")[1], 10)}號盒。`
            };

            // Save to localStorage
            localStorage.setItem("zhiku_custom_db", JSON.stringify(currentDB));
            closeModal("uploadModal");
            refreshUIState();
            initGrid();
            autoRecognizeAndSpeak(newKey);

            alert(`✅ 零件【${name}】已成功建檔！
自動分配盒號：${box}
語音提示與抽屜位置已同步建立。`);
        }

        // Voice speech
        function speakSpeech(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'zh-TW';
                utter.rate = 1.05;
                window.speechSynthesis.speak(utter);
            }
        }

        // Auto recognize & display
        function autoRecognizeAndSpeak(key) {
            curKey = key;
            const item = currentDB[key];
            if (!item) return;

            const preview = document.getElementById("previewImg");
            const sim = document.getElementById("simCanvas");

            if (item.img) {
                preview.src = item.img;
                preview.style.display = "block";
                sim.style.display = "none";
            } else {
                preview.style.display = "none";
                sim.style.display = "block";
                if (!isRealCam) drawMobileCanvas(item.type || "ic");
            }

            document.getElementById("mConfBadge").textContent = "CONFIDENCE " + (item.conf || "98.5%");
            document.getElementById("mPartName").textContent = item.name;
            document.getElementById("mPartDesc").textContent = item.desc;
            document.getElementById("mDrawerId").textContent = item.box;
            document.getElementById("mVoiceHint").textContent = `🔊 自動播報：「請放入 ${item.box} 號盒」`;
            document.getElementById("activeBoxStatus").textContent = `🟢 ${item.box} 閃爍中`;

            document.querySelectorAll(".mini-cell").forEach(el => el.classList.remove("active-drawer"));
            const target = document.getElementById("m-cell-" + item.box);
            if (target) {
                target.classList.add("active-drawer");
                target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            speakSpeech(item.speech || `辨識成功，${item.name}，請放入${item.box}號盒。`);
        }

        function triggerScanNow() {
            autoRecognizeAndSpeak(curKey);
        }

        // Modal Controls
        function handleAdminBtnClick() {
            if (isAdminLoggedIn) {
                document.getElementById("adminModal").style.display = "flex";
            } else {
                document.getElementById("loginModal").style.display = "flex";
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }

        function submitLogin() {
            const u = document.getElementById("loginUser").value.trim();
            const p = document.getElementById("loginPass").value.trim();

            if (u === "admin" && p === "123456") {
                isAdminLoggedIn = true;
                localStorage.setItem("zhiku_admin_logged", "true");
                closeModal("loginModal");
                refreshUIState();
                alert("驗證成功！已取得庫房管理員權限。");
                openPhotoUploadModal();
            } else {
                alert("帳號或密碼錯誤！(預設: admin / 123456)");
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            localStorage.removeItem("zhiku_admin_logged");
            closeModal("adminModal");
            refreshUIState();
            alert("已登出管理員身分。");
        }

        function exportDatabaseJSON() {
            const blob = new Blob([JSON.stringify(currentDB, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "zhiku_parts_database.json";
            a.click();
            URL.revokeObjectURL(url);
        }

        function resetDefaultDB() {
            if (confirm("確定還原為系統初始預設庫嗎？自訂上傳的照片與零件將被重置。")) {
                currentDB = DEFAULT_DB;
                localStorage.removeItem("zhiku_custom_db");
                refreshUIState();
                initGrid();
                autoRecognizeAndSpeak(Object.keys(currentDB)[0]);
                alert("已成功還原預設資料庫！");
                closeModal("adminModal");
            }
        }

        function drawMobileCanvas(type) {
            const cvs = document.getElementById("simCanvas");
            const ctx = cvs.getContext("2d");
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            const cx = cvs.width / 2;
            const cy = cvs.height / 2;

            if (type === "resistor") {
                ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(cx - 130, cy); ctx.lineTo(cx + 130, cy); ctx.stroke();
                ctx.fillStyle = "#dcb080";
                ctx.beginPath(); ctx.roundRect(cx - 60, cy - 20, 120, 40, 8); ctx.fill();
                const is10k = (curKey === "resistor_10k");
                const bands = is10k ? ["#5c3a21", "#000000", "#ff7700", "#ffd700"] : ["#d00000", "#d00000", "#5c3a21", "#ffd700"];
                const offsets = [-38, -16, 8, 38];
                bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(cx + offsets[i], cy - 20, 9, 40); });
            } else if (type === "led") {
                ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 3.5;
                ctx.beginPath(); ctx.moveTo(cx - 10, cy + 25); ctx.lineTo(cx - 10, cy + 100); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 10, cy + 25); ctx.lineTo(cx + 10, cy + 80); ctx.stroke();
                ctx.fillStyle = "#ef4444";
                ctx.beginPath(); ctx.arc(cx, cy - 15, 30, Math.PI, 0, false);
                ctx.lineTo(cx + 30, cy + 20); ctx.lineTo(cx - 30, cy + 20); ctx.closePath(); ctx.fill();
            } else {
                ctx.fillStyle = "#111827"; ctx.beginPath(); ctx.roundRect(cx - 65, cy - 40, 130, 80, 5); ctx.fill();
                ctx.fillStyle = "#cbd5e1";
                for (let i = 0; i < 4; i++) {
                    const px = cx - 48 + i * 32;
                    ctx.fillRect(px, cy - 52, 12, 14);
                    ctx.fillRect(px, cy + 38, 12, 14);
                }
                ctx.fillStyle = "#fff"; ctx.font = "bold 14px monospace"; ctx.fillText("IC / MODULE", cx - 44, cy + 5);
            }
        }

        async function toggleRealCam() {
            const vid = document.getElementById("mobileVideo");
            const sim = document.getElementById("simCanvas");
            const preview = document.getElementById("previewImg");

            if (!isRealCam) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                    vid.srcObject = stream;
                    vid.style.display = "block";
                    sim.style.display = "none";
                    preview.style.display = "none";
                    isRealCam = true;
                } catch (e) {
                    alert("相機啟用失敗：" + e.message);
                }
            } else {
                if (vid.srcObject) {
                    vid.srcObject.getTracks().forEach(t => t.stop());
                }
                vid.style.display = "none";
                isRealCam = false;
                autoRecognizeAndSpeak(curKey);
            }
        }

        window.onload = function() {
            refreshUIState();
            initGrid();
            autoRecognizeAndSpeak(curKey);
        };
    </script>
</body>
</html>
