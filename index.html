<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>青年百億圓夢基金計畫 - 終極鐵壁版</title>
    <!-- Tailwind CSS (僅用於左側面板) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF 與 QRCode 套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- PeerJS 跨裝置連線 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; margin: 0; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .form-input {
            width: 100%; border-radius: 0.375rem; border: 1px solid #cbd5e1; padding: 0.5rem;
            font-size: 0.875rem; background-color: #f8fafc; transition: all 0.2s; box-sizing: border-box;
        }
        .form-input:focus { outline: none; border-color: #4f46e5; background-color: #ffffff; box-shadow: 0 0 0 2px #c7d2fe; }

        /* ======================================================== */
        /* 右側預覽區 (僅供網頁上觀看) */
        /* ======================================================== */
        .preview-pane {
            background: #cbd5e1; padding: 2rem; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 2rem;
        }
        
        .a4-page {
            font-family: 'DFKai-SB', 'BiauKai', '標楷體', serif !important;
            color: black; background: white; 
            width: 210mm; min-height: 297mm;
            padding: 2.5cm; box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            box-sizing: border-box; text-align: left; font-size: 14pt; line-height: 24pt;
        }

        .a4-page table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 14pt; }
        .a4-page th, .a4-page td { border: 1px solid black; padding: 8px; vertical-align: middle; text-align: center; }
        .a4-page .no-border th, .a4-page .no-border td { border: none !important; text-align: left; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col md:flex-row relative">

    <!-- 絕對隱藏的全域資料暫存區 (防空白核心) -->
    <script>
        window.AppData = {
            name: '', id: '', birth: '', phone: '', address: '', email: '',
            em_name: '', em_relation: '', em_phone: '',
            g_name: '', g_relation: '', g_id: '', g_phone: '', g_address: '',
            project_name: '', content_1: '', content_2: '', content_3: '', content_4: '', content_5: '', content_6: '',
            funding: 'agree', isGuardian: false,
            img_front: null, img_back: null, sig_app: null, sig_gua: null
        };
    </script>

    <!-- ================= 左側：控制面板 ================= -->
    <div class="w-full md:w-5/12 lg:w-1/3 h-full bg-white shadow-2xl flex flex-col z-10 border-r border-gray-200">
        <div class="p-4 bg-indigo-600 text-white flex-shrink-0 flex items-center justify-between">
            <h1 class="text-lg font-bold">計畫申請書系統</h1>
            <span class="text-xs bg-indigo-500 px-2 py-1 rounded">鐵壁鎖死版</span>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-6" id="input-form">
            <!-- 1. 基本資料 -->
            <section class="border border-gray-200 p-4 rounded-xl bg-gray-50">
                <h2 class="text-sm font-bold text-gray-800 mb-3 border-b pb-2">1. 申請人資料</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs text-gray-600 mb-1">姓名</label><input type="text" id="i_name" class="form-input"></div>
                    <div><label class="block text-xs text-gray-600 mb-1">身分證字號</label><input type="text" id="i_id" class="form-input"></div>
                    <div><label class="block text-xs text-gray-600 mb-1">出生年月日</label><input type="date" id="i_birth" class="form-input"></div>
                    <div><label class="block text-xs text-gray-600 mb-1">手機號碼</label><input type="tel" id="i_phone" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-600 mb-1">Email</label><input type="email" id="i_email" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-600 mb-1">戶籍地址</label><input type="text" id="i_address" class="form-input"></div>
                </div>
                <div class="mt-3 pt-3 border-t">
                    <label class="block text-xs text-gray-600 font-bold mb-1">緊急連絡人</label>
                    <div class="grid grid-cols-2 gap-3">
                        <div><input type="text" id="i_em_name" class="form-input" placeholder="姓名"></div>
                        <div><input type="text" id="i_em_relation" class="form-input" placeholder="關係"></div>
                        <div class="col-span-2"><input type="tel" id="i_em_phone" class="form-input" placeholder="連絡電話"></div>
                    </div>
                </div>
            </section>

            <!-- 2. 法定代理人 -->
            <section class="border border-gray-200 p-4 rounded-xl bg-gray-50">
                <div class="flex justify-between items-center border-b pb-2 mb-3">
                    <h2 class="text-sm font-bold text-gray-800">2. 法定代理人 (未滿18歲)</h2>
                    <input type="checkbox" id="toggle_guardian" class="w-5 h-5 cursor-pointer">
                </div>
                <div id="guardian_fields" class="hidden grid-cols-2 gap-3">
                    <div><label class="block text-xs text-gray-600 mb-1">姓名</label><input type="text" id="i_g_name" class="form-input"></div>
                    <div><label class="block text-xs text-gray-600 mb-1">關係</label><input type="text" id="i_g_relation" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-600 mb-1">身分證字號</label><input type="text" id="i_g_id" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-600 mb-1">聯絡電話</label><input type="tel" id="i_g_phone" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-600 mb-1">聯絡地址</label><input type="text" id="i_g_address" class="form-input"></div>
                </div>
            </section>

            <!-- 3. 計畫資訊與圖片 -->
            <section class="border border-gray-200 p-4 rounded-xl bg-gray-50">
                <h2 class="text-sm font-bold text-gray-800 mb-3 border-b pb-2">3. 計畫資訊與證件</h2>
                <div class="space-y-3">
                    <div><label class="block text-xs text-gray-600 mb-1">計畫名稱與編號</label><input type="text" id="i_project_name" class="form-input"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs text-gray-600 mb-1">正面圖檔</label><input type="file" id="upload_id_front" accept="image/*" class="text-xs w-full"></div>
                        <div><label class="block text-xs text-gray-600 mb-1">反面圖檔</label><input type="file" id="upload_id_back" accept="image/*" class="text-xs w-full"></div>
                    </div>
                </div>
            </section>

            <!-- 4. 內文 -->
            <section class="border border-gray-200 p-4 rounded-xl bg-gray-50">
                <h2 class="text-sm font-bold text-gray-800 mb-3 border-b pb-2">4. 申請書內文</h2>
                <div class="space-y-3">
                    <div><label class="block text-xs font-bold mb-1">1. 學經歷</label><textarea id="i_content_1" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-xs font-bold mb-1">2. 對計畫了解</label><textarea id="i_content_2" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-xs font-bold mb-1">3. 動機及期待</label><textarea id="i_content_3" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-xs font-bold mb-1">4. 未來規劃及影響</label><textarea id="i_content_4" rows="2" class="form-input"></textarea></div>
                    <div class="bg-white p-2 rounded border">
                        <label class="block text-xs font-bold mb-1">5. 經費需求同意</label>
                        <div class="flex gap-4 text-sm">
                            <label><input type="radio" name="i_funding" value="agree" checked> 同意</label>
                            <label><input type="radio" name="i_funding" value="disagree"> 不同意</label>
                        </div>
                    </div>
                    <div><label class="block text-xs font-bold mb-1">6. 外語證明 (選填)</label><textarea id="i_content_5" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-xs font-bold mb-1">7. 其他證明 (選填)</label><textarea id="i_content_6" rows="2" class="form-input"></textarea></div>
                </div>
            </section>

            <!-- 5. 簽名 -->
            <section class="border border-gray-200 p-4 rounded-xl bg-gray-50 pb-8">
                <h2 class="text-sm font-bold text-gray-800 mb-3 border-b pb-2">5. 智慧簽章</h2>
                <div class="space-y-4">
                    <div class="bg-white p-3 rounded border flex items-center gap-3">
                        <div id="qr_applicant_box" style="width: 80px; height: 80px; background: #f8fafc; border: 1px solid #e2e8f0; display:flex; align-items:center; justify-content:center;">
                            <div id="qr_applicant"></div>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm">申請人簽章</h3>
                            <button type="button" onclick="openLocalSign('applicant')" class="mt-2 text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-1.5 rounded hover:bg-indigo-200 cursor-pointer">點我滑鼠簽名</button>
                            <span id="status_applicant_sign" class="text-xs text-green-600 font-bold hidden block mt-1">✅ 簽署完成</span>
                        </div>
                    </div>
                    <div id="qr_guardian_container" class="hidden bg-white p-3 rounded border flex items-center gap-3">
                        <div id="qr_guardian_box" style="width: 80px; height: 80px; background: #f8fafc; border: 1px solid #e2e8f0; display:flex; align-items:center; justify-content:center;">
                            <div id="qr_guardian"></div>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm">法定代理人簽章</h3>
                            <button type="button" onclick="openLocalSign('guardian')" class="mt-2 text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-1.5 rounded hover:bg-indigo-200 cursor-pointer">點我滑鼠簽名</button>
                            <span id="status_guardian_sign" class="text-xs text-green-600 font-bold hidden block mt-1">✅ 簽署完成</span>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- 匯出按鈕區 -->
        <div class="p-4 bg-white border-t flex gap-3 flex-shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-20">
            <button onclick="exportWord()" class="flex-1 bg-white border-2 border-indigo-600 text-indigo-700 font-bold py-3 rounded-lg hover:bg-indigo-50 transition">📥 匯出 Word</button>
            <button onclick="exportPDF()" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">📥 匯出 PDF</button>
        </div>
    </div>

    <!-- ================= 右側：實體 A4 呈現預覽區 ================= -->
    <div class="w-full md:w-7/12 lg:w-2/3 h-full preview-pane" id="preview-pane">
        <!-- 內容由 JS 自動更新 -->
    </div>

    <!-- ================= 彈出式簽名板 ================= -->
    <div id="mobile_sign_view" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center; padding: 1rem;">
        <div style="background: white; width: 100%; max-width: 500px; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">
            <div style="background: #4f46e5; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 1.1rem; font-weight: bold;" id="mobile_sign_title">請在下方簽名</h3>
                <button type="button" id="btn_mobile_close" style="background: transparent; border: none; color: white; cursor: pointer; font-size: 1.2rem;">✖</button>
            </div>
            
            <div style="padding: 15px; background: #f8fafc;">
                <!-- 絕對給定高度，保證能畫 -->
                <div id="canvas_container" style="position: relative; width: 100%; height: 300px; background: white; border: 2px dashed #cbd5e1; border-radius: 8px;">
                    <canvas id="mobile_sign_canvas" style="position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; z-index: 10; cursor: crosshair;"></canvas>
                    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #e2e8f0; font-size: 2rem; font-weight: bold; pointer-events: none; z-index: 1;">簽名區</div>
                </div>
            </div>
            
            <div style="padding: 15px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px;">
                <button type="button" id="btn_mobile_clear" style="flex: 1; padding: 12px; background: #f1f5f9; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #333;">清除重寫</button>
                <button type="button" id="btn_mobile_submit" style="flex: 2; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">確認傳送</button>
            </div>
        </div>
    </div>

    <!-- ================= 核心 JavaScript ================= -->
    <script>
        // ---------------- 資料綁定 (寫入全域物件 AppData) ----------------
        const inputs = ['name', 'id', 'birth', 'phone', 'address', 'email', 'em_name', 'em_relation', 'em_phone', 'g_name', 'g_relation', 'g_id', 'g_phone', 'g_address', 'project_name', 'content_1', 'content_2', 'content_3', 'content_4', 'content_5', 'content_6'];
        
        inputs.forEach(key => {
            document.getElementById(`i_${key}`)?.addEventListener('input', (e) => {
                window.AppData[key] = e.target.value;
                renderPreview();
            });
        });

        document.getElementById('toggle_guardian').addEventListener('change', (e) => {
            window.AppData.isGuardian = e.target.checked;
            document.getElementById('guardian_fields').style.display = e.target.checked ? 'grid' : 'none';
            document.getElementById('qr_guardian_container').style.display = e.target.checked ? 'flex' : 'none';
            renderPreview();
        });

        document.querySelectorAll('input[name="i_funding"]').forEach(r => r.addEventListener('change', e => {
            window.AppData.funding = e.target.value;
            renderPreview();
        }));

        function handleImage(id, key) {
            document.getElementById(id).addEventListener('change', e => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = ev => { window.AppData[key] = ev.target.result; renderPreview(); };
                    reader.readAsDataURL(file);
                }
            });
        }
        handleImage('upload_id_front', 'img_front');
        handleImage('upload_id_back', 'img_back');

        // ---------------- 鐵壁排版 HTML 產生器 ----------------
        // 負責產生純淨、無副作用、Word 絕對支援的傳統 HTML
        function generateDocumentHTML(forExport = false) {
            const d = window.AppData;
            const today = new Date();
            const dateY = today.getFullYear() - 1911;
            const dateM = today.getMonth() + 1;
            const dateD = today.getDate();

            const getV = (val) => val || '&nbsp;';
            const getHTML = (val) => val ? val.replace(/\n/g, '<br>') : '&nbsp;';
            
            const chkG = d.isGuardian ? '☑' : '&nbsp;&nbsp;';
            const agree = d.funding === 'agree' ? '☑' : '&nbsp;&nbsp;';
            const disagree = d.funding === 'disagree' ? '☑' : '&nbsp;&nbsp;';

            const sigAppHTML = d.sig_app ? `<img src="${d.sig_app}" style="max-height: 40px; width: auto;" />` : '<span style="color:#999; font-size:12pt;">請親筆簽名</span>';
            const sigGuaHTML = d.sig_gua ? `<img src="${d.sig_gua}" style="max-height: 40px; width: auto;" />` : '<span style="color:#999; font-size:12pt;">請親筆簽名</span>';

            const pages = [];

            // P1: 檢核清單
            pages.push(`
                <div style="text-align: right; font-size: 12pt; margin-bottom: 10px;">附件1</div>
                <div style="font-size: 18pt; font-weight: bold; text-align: center; margin-bottom: 20px; line-height: 1.5;">教育部青年發展署<br>青年百億海外圓夢基金計畫海外翱翔組<br>申請檢核清單</div>
                <table border="1" cellpadding="8" cellspacing="0" style="width: 100%; border-collapse: collapse; font-size: 14pt;">
                    <tr><th style="width: 15%; text-align:center;">檢核(請打勾)</th><th style="width: 35%; text-align:center;">內容</th><th style="text-align:center;">說明</th></tr>
                    <tr><td style="text-align:center;">[ &nbsp;&nbsp; ]</td><td>申請資料上傳</td><td>請申請人至青年百億海外圓夢基金計畫平臺，登入會員後，填寫相關報名資料。</td></tr>
                    <tr><td style="text-align:center;">[ &nbsp;&nbsp; ]</td><td colspan="2" style="text-align:center; font-weight: bold;">申請文件請於報名期間以PDF檔分別上傳至青年百億海外圓夢基金計畫平臺報名專區</td></tr>
                    <tr><td style="text-align:center;">[ &nbsp;&nbsp; ]</td><td>(1)參與切結書（簽名後掃描電子檔）</td><td>附件2</td></tr>
                    <tr><td style="text-align:center;">[ &nbsp;&nbsp; ]</td><td>(2)特殊身分證明文件掃描影本</td><td>請檢附相關證明文件。</td></tr>
                    <tr><td style="text-align:center;">[ ${chkG} ]</td><td>(3)法定代理人同意書</td><td>附件3，簽名後掃描電子檔，未成年者務必繳交</td></tr>
                    <tr><td style="text-align:center;">[ ☑ ]</td><td>(4)計畫申請書（含封面及內文）</td><td>附件4、5</td></tr>
                </table>
            `);

            // P2: 切結書
            pages.push(`
                <div style="text-align: right; font-size: 12pt; margin-bottom: 5px;">附件2</div>
                <div style="font-weight: bold; margin-bottom: 5px; font-size: 12pt;">參與切結書（須親筆簽名提供予青年百億海外圓夢基金計畫專案小組。）</div>
                <div style="font-size: 16pt; font-weight: bold; text-align: center; margin: 15px 0;">教育部青年發展署<br>青年百億海外圓夢基金計畫海外翱翔組<br>參與切結書</div>
                <div style="text-indent: 2em; margin-bottom: 10px; font-size: 14pt; text-align: justify; line-height: 1.5;">
                    本人申請教育部青年發展署「115年青年百億海外圓夢基金計畫海外翱翔組」<span style="border-bottom: 1px solid black; padding: 0 5px;">${getV(d.project_name)}</span>提案。本人確定所填資料及相關附件均屬事實，嗣後如經查，發現有不實情事，本人願負一切法律責任，並繳回已領取獎勵金，特此切結，絕無異議。
                </div>
                <div style="text-indent: 2em; margin-bottom: 20px; font-size: 14pt; text-align: justify; line-height: 1.5;">
                    另，本人同意於提案計畫審查錄取獲實踐獎勵金後，依教育部青年發展署「115年青年百億海外圓夢基金計畫海外翱翔組」相關規定辦理，參與並完成計畫。
                </div>
                <div style="margin-bottom: 15px; font-size: 14pt;">此致<br><span style="padding-left: 2em;">教育部青年發展署</span></div>
                
                <table border="1" cellpadding="6" cellspacing="0" style="width: 50%; margin: 15px 0 15px auto; border-collapse: collapse; text-align:center; font-size: 14pt;">
                    <tr><th style="width: 40%; font-weight: normal; text-align:center;">立切結書人</th><td style="text-align:center;">${getV(d.name)}</td></tr>
                    <tr><th style="font-weight: normal; text-align:center;">簽章</th><td style="height: 50px; vertical-align: middle; text-align:center;">${sigAppHTML}</td></tr>
                </table>
                <div style="text-align: right; margin-bottom: 20px; font-size: 14pt;">中華民國 <span>${dateY}</span> 年 <span>${dateM}</span> 月 <span>${dateD}</span> 日</div>

                <div style="font-size: 14pt; font-weight: bold; margin-bottom: 10px;">一、申請人資料</div>
                <table border="1" cellpadding="6" cellspacing="0" style="width: 100%; border-collapse: collapse; text-align:center; font-size: 12pt;">
                    <tr><th rowspan="2" style="width: 18%; font-weight: normal; text-align:center;">立切結書人</th><th style="font-weight: normal; text-align:center;">姓名</th><th style="font-weight: normal; text-align:center;">身分證字號</th><th style="font-weight: normal; text-align:center;">(西元)出生年/月/日</th><th style="font-weight: normal; text-align:center;">手機號碼</th><th colspan="2" style="font-weight: normal; text-align:center;">(郵遞區號)戶籍地址</th></tr>
                    <tr><td style="height: 30px; text-align:center;">${getV(d.name)}</td><td style="text-align:center;">${getV(d.id)}</td><td style="text-align:center;">${getV(d.birth)}</td><td style="text-align:center;">${getV(d.phone)}</td><td colspan="2" style="text-align: left;">${getV(d.address)}</td></tr>

                p { margin: 0; padding: 0; }
            </style></head><body>`;
            
            const htmlContent = generateDocumentHTML(true);
            const blob = new Blob(['\ufeff', header + htmlContent + '</body></html>'], { type: 'application/msword' });

        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function initCanvasSize() {
            const container = document.getElementById('canvas_container');
            canvas.width = container.clientWidth; 
            canvas.height = container.clientHeight;
            ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000000';
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        const start = e => { e.preventDefault(); isDrawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); };
        const draw = e => { e.preventDefault(); if(!isDrawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
        const stop = e => { e.preventDefault(); isDrawing = false; ctx.closePath(); };

        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stop);
        canvas.addEventListener('touchstart', start, {passive: false}); canvas.addEventListener('touchmove', draw, {passive: false}); canvas.addEventListener('touchend', stop, {passive: false});

        document.getElementById('btn_mobile_clear').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

        function cropSignatureCanvas() {
            const w = canvas.width, h = canvas.height;
            if (w === 0 || h === 0) return null;
            const imgData = ctx.getImageData(0, 0, w, h).data;
            let top = null, bottom = null, left = null, right = null;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (imgData[(y * w + x) * 4 + 3] > 0) {
                        if (top === null) top = y; bottom = y;
                        if (left === null || x < left) left = x; if (right === null || x > right) right = x;
                    }
                }
            }
            if (top === null) return null;
            const pad = 20; left = Math.max(0, left - pad); top = Math.max(0, top - pad); right = Math.min(w, right + pad); bottom = Math.min(h, bottom + pad);
            const tCanvas = document.createElement('canvas'); tCanvas.width = right - left; tCanvas.height = bottom - top;
            tCanvas.getContext('2d').drawImage(canvas, left, top, right - left, bottom - top, 0, 0, right - left, bottom - top);
            return tCanvas.toDataURL('image/png');

            window.openLocalSign = function(role) {
                document.getElementById('btn_mobile_close').style.display = 'block';
