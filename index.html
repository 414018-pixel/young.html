<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>青年百億圓夢基金計畫 - 申請書系統</title>
    <!-- Tailwind CSS (僅限左側介面使用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf.js for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

        .form-input {
            width: 100%; border-radius: 0.375rem; border: 1px solid #cbd5e1; padding: 0.5rem;
            font-size: 0.875rem; background-color: #f8fafc; transition: all 0.2s;
        }
        .form-input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 2px #c7d2fe; }

        /* ======================================================== */
        /* 右側預覽區 (這就是最終會印出來的樣子，絕對不隱藏) */
        /* ======================================================== */
        #preview-wrapper {
            background-color: #cbd5e1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
        }
        
        #preview-container {
            width: 210mm; /* 強制 A4 寬度 */
        }

        .doc-page {
            font-family: 'DFKai-SB', 'BiauKai', '標楷體', serif !important;
            font-size: 14pt; line-height: 1.5; color: black; text-align: left;
            background: white; 
            width: 210mm; /* A4 寬 */
            min-height: 297mm; /* 至少 A4 高 */
            padding: 2cm 2.5cm; box-sizing: border-box;
            margin-bottom: 2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* 避免多出一張空白頁 */
        .doc-page:last-child { margin-bottom: 0; }

        /* 傳統 HTML 表格與段落設定 (Word 100% 相容) */
        .doc-page table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 14pt; }
        .doc-page th, .doc-page td { border: 1px solid black; padding: 8px; vertical-align: middle; text-align: center; }
        .doc-page .no-border td, .doc-page .no-border th { border: none !important; text-align: left; }
        
        /* 避免表格列被腰斬 */
        tr { page-break-inside: avoid; }

        @media print {
            body * { visibility: hidden; }
            #preview-wrapper, #preview-container, #preview-container * { visibility: visible; }
            #preview-wrapper { position: absolute; left: 0; top: 0; background: white; padding: 0; width: 100%; margin: 0; }
            .doc-page { box-shadow: none; margin: 0; page-break-after: always; }
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col md:flex-row relative">

    <!-- ================= 左側控制面板 ================= -->
    <div class="w-full md:w-5/12 lg:w-1/3 h-full bg-white shadow-2xl flex flex-col z-20 border-r border-gray-200">
        <div class="p-4 bg-indigo-700 text-white flex justify-between items-center shrink-0">
            <h1 class="text-lg font-bold tracking-wider">計畫申請書系統</h1>
            <span class="text-xs bg-indigo-500 px-2 py-1 rounded">極速搶救版</span>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-5">
            <!-- 1. 基本資料 -->
            <div class="border rounded-lg p-4 bg-gray-50">
                <h2 class="font-bold text-gray-800 border-b pb-2 mb-3">1. 申請人資料</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs mb-1">姓名</label><input type="text" id="v_name" class="form-input"></div>
                    <div><label class="block text-xs mb-1">身分證字號</label><input type="text" id="v_id" class="form-input"></div>
                    <div><label class="block text-xs mb-1">出生年月日</label><input type="date" id="v_birth" class="form-input"></div>
                    <div><label class="block text-xs mb-1">手機號碼</label><input type="tel" id="v_phone" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs mb-1">Email</label><input type="email" id="v_email" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs mb-1">戶籍地址</label><input type="text" id="v_address" class="form-input"></div>
                </div>
                <div class="mt-4 pt-3 border-t">
                    <label class="block text-xs font-bold text-gray-700 mb-2">緊急連絡人</label>
                    <div class="grid grid-cols-2 gap-3">
                        <div><input type="text" id="v_em_name" class="form-input" placeholder="姓名"></div>
                        <div><input type="text" id="v_em_relation" class="form-input" placeholder="關係"></div>
                        <div class="col-span-2"><input type="tel" id="v_em_phone" class="form-input" placeholder="連絡電話"></div>
                    </div>
                </div>
            </div>

            <!-- 2. 法定代理人 -->
            <div class="border rounded-lg p-4 bg-gray-50">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-gray-800">2. 法定代理人 (未滿18歲)</h2>
                    <input type="checkbox" id="v_is_guardian" class="w-5 h-5 cursor-pointer">
                </div>
                <div id="wrap_guardian" class="hidden grid-cols-2 gap-3 pt-2 border-t">
                    <div><label class="block text-xs mb-1">姓名</label><input type="text" id="v_g_name" class="form-input"></div>
                    <div><label class="block text-xs mb-1">關係</label><input type="text" id="v_g_relation" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs mb-1">身分證字號</label><input type="text" id="v_g_id" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs mb-1">聯絡電話</label><input type="tel" id="v_g_phone" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs mb-1">聯絡地址</label><input type="text" id="v_g_address" class="form-input"></div>
                </div>
            </div>

            <!-- 3. 計畫資訊與圖片 -->
            <div class="border rounded-lg p-4 bg-gray-50">
                <h2 class="font-bold text-gray-800 border-b pb-2 mb-3">3. 計畫與證件</h2>
                <div class="space-y-3">
                    <div><label class="block text-xs mb-1">計畫名稱與編號</label><input type="text" id="v_project_name" class="form-input"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs mb-1">身分證正面</label><input type="file" id="i_img_front" accept="image/*" class="text-xs"></div>
                        <div><label class="block text-xs mb-1">身分證反面</label><input type="file" id="i_img_back" accept="image/*" class="text-xs"></div>
                    </div>
                </div>
            </div>

            <!-- 4. 內文 -->
            <div class="border rounded-lg p-4 bg-gray-50">
                <h2 class="font-bold text-gray-800 border-b pb-2 mb-3">4. 申請書內文</h2>
                <div class="space-y-4">
                    <div><label class="block text-sm font-bold mb-1">1. 學經歷</label><textarea id="v_content_1" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-sm font-bold mb-1">2. 對計畫了解</label><textarea id="v_content_2" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-sm font-bold mb-1">3. 動機及期待</label><textarea id="v_content_3" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-sm font-bold mb-1">4. 未來規劃及影響</label><textarea id="v_content_4" rows="2" class="form-input"></textarea></div>
                    <div class="bg-white p-2 rounded border">
                        <label class="block text-sm font-bold mb-1">5. 經費需求同意書</label>
                        <div class="flex gap-4 text-sm">
                            <label><input type="radio" name="v_funding" value="agree" checked> 同意</label>
                            <label><input type="radio" name="v_funding" value="disagree"> 不同意</label>
                        </div>
                    </div>
                    <div><label class="block text-sm font-bold mb-1">6. 外語證明 (選填)</label><textarea id="v_content_5" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-sm font-bold mb-1">7. 其他證明 (選填)</label><textarea id="v_content_6" rows="2" class="form-input"></textarea></div>
                </div>
            </div>

            <!-- 5. 簽名區 -->
            <div class="border rounded-lg p-4 bg-gray-50 pb-8">
                <h2 class="font-bold text-gray-800 border-b pb-2 mb-3">5. 本機智慧簽章</h2>
                <div class="space-y-4">
                    <div class="bg-white p-3 rounded border flex items-center justify-between shadow-sm">
                        <span class="font-bold text-sm">申請人簽名</span>
                        <button onclick="openSignModal('app')" class="text-xs bg-indigo-100 text-indigo-700 font-bold px-4 py-2 rounded hover:bg-indigo-200">點我開啟簽名板</button>
                    </div>
                    <div id="wrap_sign_gua" class="hidden bg-white p-3 rounded border items-center justify-between shadow-sm">
                        <span class="font-bold text-sm">法定代理人簽名</span>
                        <button onclick="openSignModal('gua')" class="text-xs bg-indigo-100 text-indigo-700 font-bold px-4 py-2 rounded hover:bg-indigo-200">點我開啟簽名板</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="p-4 bg-white border-t flex gap-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] shrink-0 z-30">
            <button onclick="exportWord()" class="flex-1 bg-white border-2 border-indigo-600 text-indigo-700 font-bold py-3 rounded-lg hover:bg-indigo-50 transition">📥 匯出 Word</button>
            <button onclick="exportPDF()" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md">📥 匯出 PDF</button>
        </div>
    </div>

    <!-- ================= 右側：直接預覽與轉檔區 ================= -->
    <!-- 所見即所得，這個區塊會直接被轉換成 PDF，保證不空白 -->
    <div class="w-full md:w-7/12 lg:w-2/3 h-full" id="preview-wrapper">
        <div id="preview-container">
            <!-- 內容由 JS 動態產生 -->
        </div>
    </div>

    <!-- ================= 簽名畫布彈出視窗 ================= -->
    <div id="sign_modal" class="hidden fixed inset-0 bg-black/60 z-[9999] flex items-center justify-center p-4">
        <div class="bg-white rounded-lg w-full max-w-lg flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-indigo-600 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold" id="sign_title">請簽名</h3>
                <button onclick="closeSignModal()" class="text-white font-bold text-xl hover:text-gray-200">&times;</button>
            </div>
            <div class="p-4 bg-gray-50">
                <div id="canvas_wrap" class="w-full h-[300px] bg-white border-2 border-dashed border-gray-400 rounded relative">
                    <canvas id="sign_canvas" class="absolute inset-0 w-full h-full touch-none z-10 cursor-crosshair"></canvas>
                    <div class="absolute inset-0 flex items-center justify-center text-gray-200 text-3xl font-bold -rotate-12 select-none z-0">簽名區</div>
                </div>
            </div>
            <div class="px-4 py-3 bg-white border-t flex gap-3">
                <button onclick="clearCanvas()" class="flex-1 py-2 bg-gray-200 font-bold text-gray-700 rounded hover:bg-gray-300">清除重寫</button>
                <button onclick="saveSignature()" class="flex-[2] py-2 bg-indigo-600 font-bold text-white rounded hover:bg-indigo-700 shadow">確認儲存</button>
            </div>
        </div>
    </div>

    <!-- ================= 系統核心架構 ================= -->
    <script>
        // 1. 全域資料狀態
        const state = {
            v_name: '', v_id: '', v_birth: '', v_phone: '', v_email: '', v_address: '',
            v_em_name: '', v_em_relation: '', v_em_phone: '',
            v_is_guardian: false,
            v_g_name: '', v_g_relation: '', v_g_id: '', v_g_phone: '', v_g_address: '',
            v_project_name: '', 
            v_content_1: '', v_content_2: '', v_content_3: '', v_content_4: '', v_content_5: '', v_content_6: '',
            v_funding: 'agree',
            img_front: null, img_back: null, sig_app: null, sig_gua: null
        };

        // 2. 綁定輸入事件
        const textFields = ['v_name', 'v_id', 'v_birth', 'v_phone', 'v_email', 'v_address', 'v_em_name', 'v_em_relation', 'v_em_phone', 'v_g_name', 'v_g_relation', 'v_g_id', 'v_g_phone', 'v_g_address', 'v_project_name', 'v_content_1', 'v_content_2', 'v_content_3', 'v_content_4', 'v_content_5', 'v_content_6'];
        
        textFields.forEach(key => {
            document.getElementById(key).addEventListener('input', e => {
                state[key] = e.target.value;
                renderDocument();
            });
        });

        document.getElementById('v_is_guardian').addEventListener('change', e => {
            state.v_is_guardian = e.target.checked;
            document.getElementById('wrap_guardian').style.display = e.target.checked ? 'grid' : 'none';
            document.getElementById('wrap_sign_gua').style.display = e.target.checked ? 'flex' : 'none';
            renderDocument();
        });

        document.querySelectorAll('input[name="v_funding"]').forEach(el => {
            el.addEventListener('change', e => { state.v_funding = e.target.value; renderDocument(); });
        });

        function bindImage(id, key) {
            document.getElementById(id).addEventListener('change', e => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = ev => { state[key] = ev.target.result; renderDocument(); };
                    reader.readAsDataURL(file);
                }
            });
        }
        bindImage('i_img_front', 'img_front');
        bindImage('i_img_back', 'img_back');

        // 3. 核心渲染引擎
        function renderDocument() {
            const y = new Date().getFullYear() - 1911;
            const m = new Date().getMonth() + 1;
            const d = new Date().getDate();

            const v = (key) => state[key] || '';
            const h = (key) => state[key] ? state[key].replace(/\n/g, '<br>') : '';
            const img = (key, text) => state[key] ? `<img src="${state[key]}" style="max-width:100%; max-height:180px; object-fit:contain;" />` : `<span style="color:#999;">${text}</span>`;
            const sig = (key) => state[key] ? `<img src="${state[key]}" style="max-height:40px; width:auto;" />` : `<span style="color:#999;">請親筆簽名</span>`;

            const chk_g = state.v_is_guardian ? '☑' : '&nbsp;&nbsp;';
            const chk_agree = state.v_funding === 'agree' ? '☑' : '&nbsp;&nbsp;';
            const chk_disagree = state.v_funding === 'disagree' ? '☑' : '&nbsp;&nbsp;';

            let html = '';

            // 頁面 1：檢核清單
            html += `
                <div class="doc-page">
                    <div style="text-align: right; font-size: 12pt; margin-bottom: 10px;">附件1</div>
                    <div style="font-size: 18pt; font-weight: bold; text-align: center; margin-bottom: 20px; line-height: 1.5;">教育部青年發展署<br>青年百億海外圓夢基金計畫海外翱翔組<br>申請檢核清單</div>
                    <table border="1" cellpadding="8" cellspacing="0">
                        <tr><th style="width: 15%;">檢核(請打勾)</th><th style="width: 35%;">內容</th><th>說明</th></tr>
                        <tr><td>[ &nbsp;&nbsp; ]</td><td>申請資料上傳</td><td style="text-align:left;">請至平臺登入填寫。</td></tr>
                        <tr><td>[ &nbsp;&nbsp; ]</td><td colspan="2" style="font-weight: bold;">申請文件請於報名期間以PDF檔分別上傳至報名專區</td></tr>
                        <tr><td>[ &nbsp;&nbsp; ]</td><td>(1)參與切結書</td><td style="text-align:left;">附件2</td></tr>
                        <tr><td>[ &nbsp;&nbsp; ]</td><td>(2)特殊身分證明文件</td><td style="text-align:left;">請檢附相關證明文件。</td></tr>
                        <tr><td>[ ${chk_g} ]</td><td>(3)法定代理人同意書</td><td style="text-align:left;">附件3，未成年者務必繳交</td></tr>
                        <tr><td>[ ☑ ]</td><td>(4)計畫申請書</td><td style="text-align:left;">附件4、5</td></tr>
                    </table>
                </div>
                <div class="html2pdf__page-break" style="page-break-before: always; height:0;"></div>
            `;

            // 頁面 2：切結書
            html += `
                <div class="doc-page">
                    <div style="text-align: right; font-size: 12pt;">附件2</div>
                    <div style="font-weight: bold; font-size: 12pt; margin-bottom: 10px;">參與切結書（須親筆簽名提供予青年百億海外圓夢基金計畫專案小組。）</div>
                    <div style="font-size: 16pt; font-weight: bold; text-align: center; margin: 20px 0;">教育部青年發展署<br>青年百億海外圓夢基金計畫海外翱翔組<br>參與切結書</div>
                    <div style="text-indent: 2em; line-height: 1.5; margin-bottom: 10px; text-align:justify;">
                        本人申請「115年青年百億海外圓夢基金計畫海外翱翔組」<span style="border-bottom: 1px solid black; padding: 0 5px;">${v('v_project_name')}</span>提案。本人確定所填資料均屬事實，嗣後如經查發現不實情事，願負一切法律責任，並繳回已領取獎勵金，特此切結。
                    </div>
                    <div style="text-indent: 2em; line-height: 1.5; margin-bottom: 20px; text-align:justify;">
                        另同意於審查錄取後，依相關規定辦理，參與並完成計畫。
                    </div>
                    <div style="margin-bottom: 20px;">此致<br><span style="padding-left: 2em;">教育部青年發展署</span></div>
                    
                    <table border="1" cellpadding="6" cellspacing="0" style="width: 60%; margin: 0 0 20px auto;">
                        <tr><th style="width: 40%; font-weight: normal;">立切結書人</th><td>${v('v_name')}</td></tr>
                        <tr><th style="font-weight: normal;">簽章</th><td style="height: 50px;">${sig('sig_app')}</td></tr>
                    </table>
                    <div style="text-align: right; margin-bottom: 20px;">中華民國 ${y} 年 ${m} 月 ${d} 日</div>

                    <div style="font-weight: bold; margin-bottom: 5px;">一、申請人資料</div>
                    <table border="1" cellpadding="6" cellspacing="0">
                        <tr><th rowspan="2" style="width: 15%; font-weight: normal;">立切結書人</th><th style="font-weight: normal;">姓名</th><th style="font-weight: normal;">身分證字號</th><th style="font-weight: normal;">出生年月日</th><th style="font-weight: normal;">手機號碼</th><th colspan="2" style="font-weight: normal;">戶籍地址</th></tr>
                        <tr><td style="height: 30px;">${v('v_name')}</td><td>${v('v_id')}</td><td>${v('v_birth')}</td><td>${v('v_phone')}</td><td colspan="2" style="text-align:left;">${v('v_address')}</td></tr>
                        <tr><th rowspan="2" style="font-weight: normal;">緊急連絡人</th><th style="font-weight: normal;">姓名</th><th style="font-weight: normal;">關係</th><th colspan="4" style="font-weight: normal;">連絡電話</th></tr>
                        <tr><td style="height: 30px;">${v('v_em_name')}</td><td>${v('v_em_relation')}</td><td colspan="4">${v('v_em_phone')}</td></tr>
                    </table>
                    <div style="margin-top: 10px;">計畫編號：<span style="border-bottom: 1px solid black; padding: 0 10px;">${v('v_project_name')}</span></div>
                </div>
                <div class="html2pdf__page-break" style="page-break-before: always; height:0;"></div>
            `;

            // 頁面 3：身分證
            html += `
                <div class="doc-page">
                    <div style="font-weight: bold; font-size: 16pt; margin-bottom: 20px;">二、請提供身分證正反面影本</div>
                    <table border="1" cellpadding="8" cellspacing="0">
                        <tr><th style="width: 25%; font-weight: normal;">立切結書人</th><th style="font-weight: normal;">證件正反面影本</th></tr>
                        <tr>
                            <td style="font-weight: bold; font-size: 16pt;">${v('v_name')}</td>
                            <td style="padding: 20px;">
                                <div style="border: 1px solid black; width: 320px; height: 200px; margin: 0 auto 20px auto; background: #f9f9f9; display:flex; justify-content:center; align-items:center;">
                                    ${img('img_front', '正面影本放置處')}
                                </div>
                                <div style="border: 1px solid black; width: 320px; height: 200px; margin: 0 auto; background: #f9f9f9; display:flex; justify-content:center; align-items:center;">
                                    ${img('img_back', '反面影本放置處')}
                                </div>
                            </td>
                        </tr>
                    </table>
                    <div style="margin-top: 15px; font-size: 12pt;">附註：本表填妥後請於報名期間以PDF檔上傳。</div>
                </div>
                <div class="html2pdf__page-break" style="page-break-before: always; height:0;"></div>
            `;

            // 頁面 4：法定代理人 (依條件)
            if (state.v_is_guardian) {
                html += `
                    <div class="doc-page">
                        <div style="text-align: right; font-size: 12pt;">附件3</div>
                        <div style="font-weight: bold; font-size: 12pt; margin-bottom: 10px;">法定代理人同意書</div>
                        <div style="font-size: 18pt; font-weight: bold; text-align: center; margin: 30px 0;">教育部青年發展署<br>115年青年百億海外圓夢基金計畫海外翱翔組<br>法定代理人同意書</div>
                        <div style="text-indent: 2em; line-height: 2; margin-bottom: 30px; text-align:justify;">

            const r = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;

            for(let y=0; y<h; y++) {
