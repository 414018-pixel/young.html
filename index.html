<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>連鎖餐飲 POS 與點餐系統</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
:root{
  --bg:#f2f3ef; --surface:#ffffff; --soft:#eaece6; --ink:#1d2420; --muted:#626d65; --line:#dadfd6;
  --accent:#c4332a; --accent-ink:#ffffff; --tint:#fbe7e4;
  --ok:#1d7648; --ok-t:#dff1e6; --warn:#92610a; --warn-t:#fbefd2; --bad:#b42318; --bad-t:#fde4e1; --info:#2457a6; --info-t:#e1eafa;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-disp:'Noto Serif TC','Songti TC',serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding:16px;margin:0}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 20px var(--f-disp)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:500;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{padding:4px 10px;font-size:13px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;min-height:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:100}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:500}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
const LS_STORE = 'pos-store-data';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');

// 判斷是電腦版還是手機版 (依據營幕寬度 900px 為界線)
const isMobile = window.innerWidth < 900;

let S = JSON.parse(localStorage.getItem(LS_STORE)) || {
  pin: '1234',
  storeName: '巷口食堂 (總店)',
  menu: [
    {id:'m1', cat:'主食', name:'滷肉飯', price:45, desc:'古早味肉燥'},
    {id:'m2', cat:'主食', name:'紅燒牛肉麵', price:180, desc:'熬煮六小時'},
    {id:'m3', cat:'飲品', name:'古早味紅茶', price:30, desc:'茶香濃回甘'}
  ],
  orders: [],
  nextNo: 101,
  authed: !isMobile // 若為手機版預設為顧客; 若為電腦版需登入
};

function save(){ localStorage.setItem(LS_STORE, JSON.stringify(S)); }
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;setTimeout(()=>t.hidden=true,2000);}

let ui = { tab:'counter', pinInput:'', cart:[], orderType:'dine', table:'1', customerName:'', phone:'', note:'' };

function render(){
  const app = $('#app');
  if(isMobile){
    // ====== 手機版：專屬顧客點餐 ======
    app.innerHTML = `
      <header class="top">
        <div class="brand"><span class="mark">客</span><div><b>${esc(S.storeName)} · 線上點餐</b><small>歡迎光臨，美味現做</small></div></div>
        <button class="btn sm" onclick="switchToAdmin()">店員/店長登入</button>
      </header>
      <main>${customerView()}</main>
    `;
  } else {
    // ====== 電腦版：商家 POS / 後台管理（需密碼） ======
    if(!S.authed){
      app.innerHTML = `
        <div style="max-width:380px; margin:80px auto; text-align:center;" class="card">
          <h2>🔒 商家後台登入</h2>
          <p class="muted" style="margin:10px 0">請輸入電腦版管理密碼（預設：1234）</p>
          <input type="password" id="pin-box" class="inp" style="text-align:center; font-size:22px; letter-spacing:6px; margin-bottom:12px;" placeholder="****">
          <button class="btn pri" style="width:100%" onclick="tryLogin()">登入管理後台</button>
        </div>
      `;
      return;
    }
    app.innerHTML = `
      <header class="top">
        <div class="brand"><span class="mark">商</span><div><b>${esc(S.storeName)} · 電腦版 POS 系統</b><small>授權管理中</small></div></div>
        <div class="row">
          <button class="btn sm" onclick="S.authed=false;render()">鎖定登出</button>
        </div>
      </header>
      <nav class="tabs">
        <button class="tab ${ui.tab==='counter'?'on':''}" onclick="ui.tab='counter';render()">櫃台與訂單</button>
        <button class="tab ${ui.tab==='kitchen'?'on':''}" onclick="ui.tab='kitchen';render()">廚房出餐看板</button>
        <button class="tab ${ui.tab==='settings'?'on':''}" onclick="ui.tab='settings';render()">店家設定與密碼</button>
      </nav>
      <main>${adminView()}</main>
    `;
  }
}

function switchToAdmin(){
  const pin = prompt('請輸入電腦版管理密碼（預設 1234）：');
  if(pin === S.pin){
    S.authed = true;
    save();
    location.reload(); // 切換為電腦管理檢視
  } else if(pin !== null) {
    alert('密碼錯誤！');
  }
}

function tryLogin(){
  const val = $('#pin-box').value.trim();
  if(val === S.pin){
    S.authed = true;
    save();
    render();
  } else {
    toast('❌ 密碼錯誤');
  }
}

// ====== 顧客點餐介面 (手機版) ======
function customerView(){
  const total = ui.cart.reduce((a,b)=>a+b.price*b.qty,0);
  return `
    <div class="grid2">
      <div>
        <h2>菜單列表</h2>
        <div class="menu-grid" style="margin-top:10px">
          ${S.menu.map(m=>`
            <div class="item">
              <div><b>${esc(m.name)}</b> <span class="muted">${money(m.price)}</span></div>
              <p class="muted">${esc(m.desc)}</p>
              <button class="btn pri sm" onclick="addToCart('${m.id}')">加入購物車</button>
            </div>
          `).join('')}
        </div>
      </div>
      <div>
        <div class="card">
          <h2>您的購物車</h2>
          ${ui.cart.length === 0 ? '<p class="muted" style="margin-top:10px">購物車目前是空的</p>' : `
            <div style="margin-top:10px; display:grid; gap:8px">
              ${ui.cart.map((item, idx)=>`
                <div class="row sp"><span>${esc(item.name)} x${item.qty}</span> <b>${money(item.price*item.qty)}</b></div>
              `).join('')}
              <hr style="border:0; border-top:1px solid var(--line)">
              <div class="row sp"><b>總計金額</b> <b style="font-size:18px">${money(total)}</b></div>
              <label class="f" style="margin-top:8px">用餐方式
                <select class="inp" onchange="ui.orderType=this.value">
                  <option value="dine">內用</option>
                  <option value="take">外帶</option>
                </select>
              </label>
              <label class="f">桌號 / 姓名 <input class="inp" placeholder="例如：3 號桌 或 王小姐" oninput="ui.customerName=this.value"></label>
              <button class="btn pri" style="margin-top:8px; width:100%" onclick="submitOrder()">送出訂單</button>
            </div>
          `}
        </div>
      </div>
    </div>
  `;
}

function addToCart(id){
  const m = S.menu.find(x=>x.id===id);
  const ex = ui.cart.find(x=>x.id===id);
  if(ex) ex.qty++; else ui.cart.push({...m, qty:1});
  toast('已加入：'+m.name);
  render();
}

function submitOrder(){
  if(ui.cart.length===0) return;
  const total = ui.cart.reduce((a,b)=>a+b.price*b.qty,0);
  const newOrd = {
    no: S.nextNo++,
    type: ui.orderType,
    info: ui.customerName || '散客',
    lines: [...ui.cart],
    total,
    status: 'pending',
    time: new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'})
  };
  S.orders.push(newOrd);
  save();
  ui.cart = [];
  alert('🎉 訂單送出成功！您的取餐單號為：#'+newOrd.no);
  render();
}

// ====== 電腦版商家後台 ======
function adminView(){
  if(ui.tab==='counter'){
    return `
      <h2>櫃台即時訂單管理</h2>
      <div style="margin-top:12px; display:grid; gap:10px">
        ${S.orders.length===0 ? '<p class="muted">目前沒有任何訂單</p>' : S.orders.map(o=>`
          <div class="card row sp">
            <div>
              <b>#${o.no} (${o.type==='dine'?'內用':'外帶'}) - ${esc(o.info)}</b>
              <div class="muted">${o.lines.map(l=>l.name+'x'+l.qty).join(', ')} | 總計：${money(o.total)} \vert{} 時間：${o.time}</div>
            </div>
            <div class="row">
              <span class="pill ${o.status==='pending'?'warn':'ok'}">${o.status==='pending'?'待製作':'已完成'}</span>
              ${o.status==='pending'?`<button class="btn pri sm" onclick="finishOrder(${o.no})">完成出餐</button>`:''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  if(ui.tab==='kitchen'){
    return `
      <h2>廚房工作看板 (KDS)</h2>
      <div class="grid2" style="margin-top:12px">
        <div class="card">
          <h3>製作中訂單</h3>
          ${S.orders.filter(o=>o.status==='pending').map(o=>`
            <div style="background:var(--soft); padding:10px; border-radius:8px; margin-top:8px">
              <b>#${o.no} (${o.type==='dine'?'內用':'外帶'}) ${esc(o.info)}</b>
              <div>${o.lines.map(l=>l.name+' x'+l.qty).join('<br>')}</div>
            </div>
          `).join('') || '<p class="muted" style="margin-top:8px">目前無待製作訂單</p>'}
        </div>
      </div>
    `;
  }
  if(ui.tab==='settings'){
    return `
      <h2>店家基本設定與密碼變更</h2>
      <div class="card" style="margin-top:12px; display:grid; gap:12px; max-width:500px">
        <label class="f">店家名稱 <input class="inp" id="st-name" value="${esc(S.storeName)}"></label>
        <label class="f">變更管理密碼 (PIN) <input class="inp" id="st-pin" value="${esc(S.pin)}"></label>
        <button class="btn pri" onclick="saveSettings()">儲存變更設定</button>
      </div>
    `;
  }
}

function finishOrder(no){
  const o = S.orders.find(x=>x.no===no);
  if(o) o.status = 'done';
  save();
  render();
  toast('訂單 #'+no+' 已完成');
}

function saveSettings(){
  S.storeName = $('#st-name').value.trim() || '巷口食堂';
  S.pin = $('#st-pin').value.trim() || '1234';
  save();
  toast('✅ 設定已儲存');
  render();
}

render();
</script>
</body>
</html>
