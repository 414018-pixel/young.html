<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智庫管家 Mobile - 自動音声認識システム</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #151d2e;
            --card-inner: #0d131f;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-ui: #222f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .mobile-shell {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            padding-bottom: 24px;
        }

        .app-bar {
            padding: 14px 18px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-ui);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .app-title-group h1 {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .app-title-group p {
            font-size: 0.72rem;
            color: var(--text-sub);
        }

        .voice-state-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cam-frame {
            position: relative;
            margin: 12px 16px 8px;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4 / 3;
            border: 1.5px solid var(--border-ui);
        }

        #mobileVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #simCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #070b12;
        }

        .scan-overlay {
            position: absolute;
            inset: 16px;
            border: 1.5px dashed rgba(6, 182, 212, 0.5);
            border-radius: 12px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }

        .scan-laser-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-cyan);
            animation: moveLaser 2.2s infinite ease-in-out alternate;
        }

        @keyframes moveLaser {
            0% { top: 8%; opacity: 0.2; }
            50% { opacity: 1; }
            100% { top: 92%; opacity: 0.2; }
        }

        .cam-tools {
            position: absolute;
            bottom: 10px;
            right: 10px;
        }

        .tool-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-ui);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            cursor: pointer;
        }

        .info-container {
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-ui);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .conf-badge {
            font-size: 0.7rem;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .part-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
        }

        .part-desc {
            font-size: 0.78rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .drawer-box-indicator {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(6, 182, 212, 0.15));
            border: 2px solid var(--accent-green);
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
            min-width: 90px;
        }

        .drawer-box-label {
            font-size: 0.65rem;
            color: var(--accent-green);
            font-weight: 700;
        }

        .drawer-box-id {
            font-size: 1.6rem;
            font-weight: 900;
            color: #fff;
            font-family: monospace;
        }

        .matrix-section {
            background: var(--card-inner);
            border: 1px solid var(--border-ui);
            border-radius: 14px;
            padding: 12px;
        }

        .drawer-grid-mini {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .mini-cell {
            background: #141c2c;
            border: 1px solid var(--border-ui);
            border-radius: 6px;
            padding: 6px 4px;
            text-align: center;
        }

        .mini-cell .cid {
            font-size: 0.68rem;
            font-family: monospace;
            font-weight: 700;
            color: var(--text-sub);
        }

        .mini-cell .cname {
            font-size: 0.62rem;
            color: #e2e8f0;
            display: block;
        }

        .mini-cell.active-drawer {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--accent-green);
        }
        .mini-cell.active-drawer .cid {
            color: var(--accent-green);
        }

        .bottom-actions {
            margin-top: auto;
            padding: 12px 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .main-scan-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .demo-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .demo-select {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-ui);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="mobile-shell">
        <header class="app-bar">
            <div class="app-title-group">
                <h1>智庫管家 <span>Mobile</span></h1>
                <p>AI 自動スキャン＆音声案内</p>
            </div>
            <div class="voice-state-badge" id="voiceStateBadge">
                ● 自動音声: ON
            </div>
        </header>

        <div class="cam-frame">
            <video id="mobileVideo" autoplay playsinline muted></video>
            <canvas id="simCanvas" width="480" height="360"></canvas>

            <div class="scan-overlay">
                <div style="font-size:0.7rem; color:var(--accent-cyan); font-family:monospace;">AUTO_SCAN: ACTIVE</div>
                <div class="scan-laser-line"></div>
                <div style="font-size:0.7rem; color:var(--accent-green); font-family:monospace; align-self:flex-end;">VOICE_READY</div>
            </div>

            <div class="cam-tools">
                <button class="tool-btn" onclick="toggleRealCam()">📷 カメラ切替</button>
            </div>
        </div>

        <div class="info-container">
            <div class="result-card">
                <div class="part-details">
                    <span class="conf-badge" id="mConfBadge">CONFIDENCE 98.4%</span>
                    <h2 class="part-name" id="mPartName">10kΩ 四環電阻</h2>
                    <p class="part-desc" id="mPartDesc">色コード：茶・黒・橙・金 (±5%)</p>
                    <p style="font-size:0.75rem; color:#38bdf8; margin-top:6px;" id="mVoiceHint">🔊 案内中...</p>
                </div>
                <div class="drawer-box-indicator">
                    <div class="drawer-box-label">収納ボックス</div>
                    <div class="drawer-box-id" id="mDrawerId">A-03</div>
                </div>
            </div>

            <div class="matrix-section">
                <div style="font-size:0.75rem; color:var(--text-sub); display:flex; justify-content:space-between;">
                    <span>🗄️ 引き出しラック位置案内</span>
                    <span style="color:var(--accent-green);">🟢 点滅中</span>
                </div>
                <div class="drawer-grid-mini" id="miniDrawerGrid"></div>
            </div>
        </div>

        <div class="bottom-actions">
            <div class="demo-bar">
                <span>テスト部品切替：</span>
                <select class="demo-select" id="partPick" onchange="autoRecognizeAndSpeak(this.value)">
                    <option value="resistor_10k">10kΩ 抵抗 ➜ A-03</option>
                    <option value="resistor_220">220Ω 抵抗 ➜ A-01</option>
                    <option value="led_red">赤色 LED ➜ B-02</option>
                    <option value="cap_electrolytic">100µF 電解コンデンサ ➜ B-04</option>
                    <option value="cap_ceramic">104 セラミックコンデンサ ➜ C-01</option>
                    <option value="ic_ne555">NE555 タイマーIC ➜ C-03</option>
                </select>
            </div>
            <button class="main-scan-btn" onclick="triggerAutoVoiceStart()">
                <span>🔊 自動音声スキャンを開始（画面タップ）</span>
            </button>
        </div>
    </div>

    <script>
        const M_DATA = {
            "resistor_10k": { name: "10kΩ 四環電阻", desc: "色碼：棕 · 黑 · 橙 · 金 (±5%)", box: "A-03", conf: "98.4%", type: "resistor", speech: "認識完了。10kオーム抵抗です。A区3番ボックスへ収納してください。" },
            "resistor_220": { name: "220Ω 四環電阻", desc: "色碼：紅 · 紅 · 棕 · 金 (±5%)", box: "A-01", conf: "97.1%", type: "resistor", speech: "認識完了。220オーム電流制限抵抗です。A区1番ボックスへ収納してください。" },
            "led_red": { name: "5mm 赤色LED", desc: "長い足がアノード(+) / 順方向電圧 2V", box: "B-02", conf: "99.2%", type: "led", speech: "赤色LEDを検出しました。長い足がプラスです。B区2番ボックスへ収納してください。" },
            "cap_electrolytic": { name: "100µF 電解電容", desc: "極性あり！白いライン側がマイナス(-)", box: "B-04", conf: "96.5%", type: "cap_elec", speech: "注意。100マイクロファラッド電解コンデンサです。極性に注意しB区4番ボックスへ収納してください。" },
            "cap_ceramic": { name: "104 セラミック電容", desc: "極性なし / 容量 0.1µF", box: "C-01", conf: "95.8%", type: "cap_cer", speech: "104セラミックコンデンサです。C区1番ボックスへ収納してください。" },
            "ic_ne555": { name: "NE555 タイマーIC", desc: "DIP-8パッケージ / 切り欠き左が1番ピン", box: "C-03", conf: "98.9%", type: "ic", speech: "NE555タイマーICです。足の曲がりに注意し、C区3番ボックスへ収納してください。" }
        };

        const M_BOXES = [
            { id: "A-01", name: "220Ω" }, { id: "A-02", name: "1kΩ" }, { id: "A-03", name: "10kΩ" }, { id: "A-04", name: "100kΩ" },
            { id: "B-01", name: "緑LED" }, { id: "B-02", name: "赤LED" }, { id: "B-03", name: "10µF" }, { id: "B-04", name: "100µF" },
            { id: "C-01", name: "104磁" }, { id: "C-02", name: "ダイオード" }, { id: "C-03", name: "555" }, { id: "C-04", name: "Tr" }
        ];

        let curKey = "resistor_10k";
        let isRealCam = false;
        let lastSpokenKey = "";

        function initMiniGrid() {
            const grid = document.getElementById("miniDrawerGrid");
            grid.innerHTML = "";
            M_BOXES.forEach(b => {
                const cell = document.createElement("div");
                cell.className = "mini-cell" + (b.id === "A-03" ? " active-drawer" : "");
                cell.id = "m-cell-" + b.id;
                cell.innerHTML = `<span class="cid">${b.id}</span><span class="cname">${b.name}</span>`;
                grid.appendChild(cell);
            });
        }

        function drawMobileCanvas(type) {
            const cvs = document.getElementById("simCanvas");
            const ctx = cvs.getContext("2d");
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            const cx = cvs.width / 2;
            const cy = cvs.height / 2;

            if (type === "resistor") {
                ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(cx - 130, cy); ctx.lineTo(cx + 130, cy); ctx.stroke();
                ctx.fillStyle = "#dcb080";
                ctx.beginPath(); ctx.roundRect(cx - 60, cy - 20, 120, 40, 8); ctx.fill();
                const is10k = (curKey === "resistor_10k");
                const bands = is10k ? ["#5c3a21", "#000000", "#ff7700", "#ffd700"] : ["#d00000", "#d00000", "#5c3a21", "#ffd700"];
                const offsets = [-38, -16, 8, 38];
                bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(cx + offsets[i], cy - 20, 9, 40); });
            } else if (type === "led") {
                ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 3.5;
                ctx.beginPath(); ctx.moveTo(cx - 10, cy + 25); ctx.lineTo(cx - 10, cy + 100); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 10, cy + 25); ctx.lineTo(cx + 10, cy + 80); ctx.stroke();
                ctx.fillStyle = "#ef4444";
                ctx.beginPath(); ctx.arc(cx, cy - 15, 30, Math.PI, 0, false);
                ctx.lineTo(cx + 30, cy + 20); ctx.lineTo(cx - 30, cy + 20); ctx.closePath(); ctx.fill();
            } else if (type === "cap_elec") {
                ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 3.5;
                ctx.beginPath(); ctx.moveTo(cx - 12, cy + 35); ctx.lineTo(cx - 12, cy + 95); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 12, cy + 35); ctx.lineTo(cx + 12, cy + 80); ctx.stroke();
                ctx.fillStyle = "#1e293b"; ctx.beginPath(); ctx.roundRect(cx - 38, cy - 50, 76, 90, 6); ctx.fill();
                ctx.fillStyle = "#e2e8f0"; ctx.fillRect(cx + 16, cy - 50, 14, 90);
                ctx.fillStyle = "#000"; ctx.font = "bold 14px monospace"; ctx.fillText("-", cx + 19, cy);
            } else if (type === "cap_cer") {
                ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(cx - 12, cy + 15); ctx.lineTo(cx - 12, cy + 80); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 12, cy + 15); ctx.lineTo(cx + 12, cy + 80); ctx.stroke();
                ctx.fillStyle = "#d97706"; ctx.beginPath(); ctx.arc(cx, cy - 10, 36, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#000"; ctx.font = "bold 15px monospace"; ctx.fillText("104", cx - 14, cy - 6);
            } else if (type === "ic") {
                ctx.fillStyle = "#111827"; ctx.beginPath(); ctx.roundRect(cx - 65, cy - 40, 130, 80, 5); ctx.fill();
                ctx.fillStyle = "#cbd5e1";
                for (let i = 0; i < 4; i++) {
                    const px = cx - 48 + i * 32;
                    ctx.fillRect(px, cy - 52, 12, 14);
                    ctx.fillRect(px, cy + 38, 12, 14);
                }
                ctx.fillStyle = "#fff"; ctx.font = "bold 14px monospace"; ctx.fillText("NE555", cx - 22, cy + 5);
            }
        }

        // 自動音声読み上げ実行関数
        function speakSpeech(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 前の読み上げを中断
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'ja-JP'; // 中国語で読み上げる場合は 'zh-TW'
                utter.rate = 1.05;
                window.speechSynthesis.speak(utter);
            }
        }

        // 部品認識と自動アナウンスの連携
        function autoRecognizeAndSpeak(key) {
            curKey = key;
            const item = M_DATA[key];
            if (!item) return;

            if (!isRealCam) drawMobileCanvas(item.type);

            document.getElementById("mConfBadge").textContent = "CONFIDENCE " + item.conf;
            document.getElementById("mPartName").textContent = item.name;
            document.getElementById("mPartDesc").textContent = item.desc;
            document.getElementById("mDrawerId").textContent = item.box;
            document.getElementById("mVoiceHint").textContent = `🔊 案内：「${item.box} へ収納」`;

            document.querySelectorAll(".mini-cell").forEach(el => el.classList.remove("active-drawer"));
            const target = document.getElementById("m-cell-" + item.box);
            if (target) target.classList.add("active-drawer");

            // スキャン結果が変わるたびに自動でアナウンス
            speakSpeech(item.speech);
            lastSpokenKey = key;
        }

        function triggerAutoVoiceStart() {
            autoRecognizeAndSpeak(curKey);
        }

        async function toggleRealCam() {
            const vid = document.getElementById("mobileVideo");
            const cvs = document.getElementById("simCanvas");

            if (!isRealCam) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                    vid.srcObject = stream;
                    vid.style.display = "block";
                    cvs.style.display = "none";
                    isRealCam = true;
                } catch (e) {
                    alert("カメラを起動できませんでした：" + e.message);
                }
            } else {
                if (vid.srcObject) {
                    vid.srcObject.getTracks().forEach(t => t.stop());
                }
                vid.style.display = "none";
                cvs.style.display = "block";
                isRealCam = false;
                drawMobileCanvas(M_DATA[curKey].type);
            }
        }

        window.onload = function() {
            initMiniGrid();
            drawMobileCanvas(M_DATA[curKey].type);
        };
    </script>
</body>
</html>
