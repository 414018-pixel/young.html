<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智庫管家 - AI 庫房零件辨識與後台管理系統</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #151d2e;
            --card-inner: #0d131f;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-rose: #f43f5e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-ui: #222f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .mobile-shell {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            padding-bottom: 24px;
            position: relative;
        }

        /* Top Bar */
        .app-bar {
            padding: 14px 18px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-ui);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .app-title-group h1 {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .app-title-group p {
            font-size: 0.72rem;
            color: var(--text-sub);
        }

        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .admin-btn {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .admin-btn.logged-in {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* Camera Viewport */
        .cam-frame {
            position: relative;
            margin: 12px 16px 8px;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4 / 3;
            border: 1.5px solid var(--border-ui);
        }

        #mobileVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #simCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #070b12;
        }

        .scan-overlay {
            position: absolute;
            inset: 16px;
            border: 1.5px dashed rgba(6, 182, 212, 0.5);
            border-radius: 12px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }

        .scan-laser-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-cyan);
            animation: moveLaser 2.2s infinite ease-in-out alternate;
        }

        @keyframes moveLaser {
            0% { top: 8%; opacity: 0.2; }
            50% { opacity: 1; }
            100% { top: 92%; opacity: 0.2; }
        }

        .cam-tools {
            position: absolute;
            bottom: 10px;
            right: 10px;
        }

        .tool-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-ui);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            cursor: pointer;
        }

        /* Result Panel */
        .info-container {
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-ui);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .part-details {
            flex: 1;
        }

        .conf-badge {
            font-size: 0.7rem;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .part-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
        }

        .part-desc {
            font-size: 0.78rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .drawer-box-indicator {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(6, 182, 212, 0.15));
            border: 2px solid var(--accent-green);
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
            min-width: 90px;
        }

        .drawer-box-label {
            font-size: 0.65rem;
            color: var(--accent-green);
            font-weight: 700;
        }

        .drawer-box-id {
            font-size: 1.6rem;
            font-weight: 900;
            color: #fff;
            font-family: monospace;
        }

        /* Drawer Mini Grid */
        .matrix-section {
            background: var(--card-inner);
            border: 1px solid var(--border-ui);
            border-radius: 14px;
            padding: 12px;
        }

        .drawer-grid-mini {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .mini-cell {
            background: #141c2c;
            border: 1px solid var(--border-ui);
            border-radius: 6px;
            padding: 6px 4px;
            text-align: center;
            transition: all 0.2s;
        }

        .mini-cell .cid {
            font-size: 0.68rem;
            font-family: monospace;
            font-weight: 700;
            color: var(--text-sub);
        }

        .mini-cell .cname {
            font-size: 0.62rem;
            color: #e2e8f0;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-cell.active-drawer {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--accent-green);
        }
        .mini-cell.active-drawer .cid {
            color: var(--accent-green);
        }

        /* Action bottom */
        .bottom-actions {
            margin-top: auto;
            padding: 12px 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .demo-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .demo-select {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-ui);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
        }

        .main-scan-btn {
            background: linear-gradient(135deg, #0284c7, #06b6d4);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Modal / Dialog */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-panel {
            background: #151d2e;
            border: 1.5px solid var(--border-ui);
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.78rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .text-input {
            background: #090d16;
            border: 1px solid var(--border-ui);
            border-radius: 8px;
            padding: 10px 12px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        .text-input:focus {
            border-color: var(--accent-cyan);
        }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7, #06b6d4);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Upload Area */
        .upload-dropzone {
            border: 2px dashed var(--accent-cyan);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: rgba(6, 182, 212, 0.05);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .upload-dropzone:hover {
            background: rgba(6, 182, 212, 0.1);
        }

        .db-stat-tag {
            font-size: 0.72rem;
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.12);
            padding: 4px 8px;
            border-radius: 6px;
            align-self: flex-start;
        }
    </style>
</head>
<body>

    <div class="mobile-shell">
        <!-- Top Header -->
        <header class="app-bar">
            <div class="app-title-group">
                <h1>智庫管家 <span>Pro</span></h1>
                <p>AI 自動辨識與零件後台管理</p>
            </div>
            <div class="nav-actions">
                <button class="admin-btn" id="adminToggleBtn" onclick="handleAdminBtnClick()">
                    🔐 管理員登入
                </button>
            </div>
        </header>

        <!-- Camera Area -->
        <div class="cam-frame">
            <video id="mobileVideo" autoplay playsinline muted></video>
            <canvas id="simCanvas" width="480" height="360"></canvas>

            <div class="scan-overlay">
                <div style="font-size:0.7rem; color:var(--accent-cyan); font-family:monospace;" id="dbStatusBadge">
                    DB_RECORDS: 6 元件已就緒
                </div>
                <div class="scan-laser-line"></div>
                <div style="font-size:0.7rem; color:var(--accent-green); font-family:monospace; align-self:flex-end;">AUTO_VOICE: ON</div>
            </div>

            <div class="cam-tools">
                <button class="tool-btn" onclick="toggleRealCam()">📷 切換真鏡頭</button>
            </div>
        </div>

        <!-- Result Box -->
        <div class="info-container">
            <div class="result-card">
                <div class="part-details">
                    <span class="conf-badge" id="mConfBadge">CONFIDENCE 98.4%</span>
                    <h2 class="part-name" id="mPartName">10kΩ 四環電阻</h2>
                    <p class="part-desc" id="mPartDesc">色碼：棕 · 黑 · 橙 · 金 (±5%)</p>
                    <p style="font-size:0.75rem; color:#38bdf8; margin-top:6px;" id="mVoiceHint">🔊 自動播報：「請放入 A 區 3 號盒」</p>
                </div>
                <div class="drawer-box-indicator">
                    <div class="drawer-box-label">建議盒號</div>
                    <div class="drawer-box-id" id="mDrawerId">A-03</div>
                </div>
            </div>

            <!-- Warehouse Grid -->
            <div class="matrix-section">
                <div style="font-size:0.75rem; color:var(--text-sub); display:flex; justify-content:space-between;">
                    <span>🗄️ 實習工場抽屜櫃座標矩陣</span>
                    <span style="color:var(--accent-green);" id="activeBoxStatus">🟢 A-03 閃爍中</span>
                </div>
                <div class="drawer-grid-mini" id="miniDrawerGrid"></div>
            </div>
        </div>

        <!-- Bottom Actions -->
        <div class="bottom-actions">
            <div class="demo-bar">
                <span>切換掃描元件：</span>
                <select class="demo-select" id="partPick" onchange="autoRecognizeAndSpeak(this.value)">
                    <!-- Dynamically populated from Database -->
                </select>
            </div>
            <button class="main-scan-btn" onclick="triggerScanNow()">
                <span>⚡ 對準零件立即歸位 (自動語音)</span>
            </button>
        </div>
    </div>

    <!-- Modal 1: Login Dialog -->
    <div class="modal-backdrop" id="loginModal">
        <div class="modal-panel">
            <div class="modal-header">
                <div class="modal-title">🔐 庫房管理員登入</div>
                <button class="close-btn" onclick="closeModal('loginModal')">✕</button>
            </div>
            <div class="input-group">
                <label>管理員帳號 (預設: admin)</label>
                <input type="text" class="text-input" id="loginUser" placeholder="請輸入帳號" value="admin">
            </div>
            <div class="input-group">
                <label>登入密碼 (預設: 123456)</label>
                <input type="password" class="text-input" id="loginPass" placeholder="請輸入密碼" value="123456">
            </div>
            <button class="btn-submit" onclick="submitLogin()">立即驗證登入</button>
        </div>
    </div>

    <!-- Modal 2: Database Upload & Management Dialog -->
    <div class="modal-backdrop" id="adminModal">
        <div class="modal-panel">
            <div class="modal-header">
                <div class="modal-title">🗄️ 庫房零件資料庫管理</div>
                <button class="close-btn" onclick="closeModal('adminModal')">✕</button>
            </div>
            
            <div class="db-stat-tag" id="adminDbStat">目前零件庫共 6 筆資料</div>

            <!-- Upload Box -->
            <div class="upload-dropzone" onclick="document.getElementById('dbFileInput').click()">
                <div style="font-size:2rem;">📤</div>
                <div style="font-weight:700; font-size:0.9rem;">點擊上傳自訂零件庫 (.JSON / .CSV)</div>
                <div style="font-size:0.75rem; color:var(--text-sub);">支援快速替換實習工場抽屜編號與零件規格</div>
                <input type="file" id="dbFileInput" accept=".json,.csv" style="display:none;" onchange="handleFileUpload(event)">
            </div>

            <div style="display:flex; justify-content:space-between; gap:10px;">
                <button class="admin-btn" style="flex:1;" onclick="exportDatabaseJSON()">📥 下載當前備份</button>
                <button class="admin-btn" style="flex:1; border-color:var(--accent-rose); color:var(--accent-rose);" onclick="resetDefaultDB()">🔄 還原預設值</button>
            </div>

            <button class="btn-submit" style="background:#334155;" onclick="logoutAdmin()">登出管理員身分</button>
        </div>
    </div>

    <script>
        // Default Component Database
        const DEFAULT_DB = {
            "resistor_10k": { name: "10kΩ 四環電阻", desc: "色碼：棕 · 黑 · 橙 · 金 (±5%)", box: "A-03", conf: "98.4%", type: "resistor", speech: "辨識完成，10k歐姆電阻，請放入A區3號盒。" },
            "resistor_220": { name: "220Ω 四環電阻", desc: "色碼：紅 · 紅 · 棕 · 金 (±5%)", box: "A-01", conf: "97.1%", type: "resistor", speech: "辨識完成，220歐姆限流電阻，請放入A區1號盒。" },
            "led_red": { name: "5mm 紅色 LED", desc: "長正短負 / 順向電壓約 2V", box: "B-02", conf: "99.2%", type: "led", speech: "偵測到紅色發光二極體，長腳為正極，請放入B區2號盒。" },
            "cap_electrolytic": { name: "100µF 電解電容", desc: "有極性！灰條標示為負極(-)", box: "B-04", conf: "96.5%", type: "cap_elec", speech: "注意！100微法拉電解電容，有正負極區分，請放入B區4號盒。" },
            "cap_ceramic": { name: "104 陶瓷電容", desc: "無極性 / 容值 0.1µF 去耦電容", box: "C-01", conf: "95.8%", type: "cap_cer", speech: "104陶瓷去耦電容，請歸入C區1號盒。" },
            "ic_ne555": { name: "NE555 定時 IC", desc: "DIP-8 封裝 / 缺口左側為第1腳", box: "C-03", conf: "98.9%", type: "ic", speech: "NE555定時IC，請注意引腳方向，放入C區3號IC盒。" }
        };

        const M_BOXES = [
            { id: "A-01", name: "220Ω" }, { id: "A-02", name: "1kΩ" }, { id: "A-03", name: "10kΩ" }, { id: "A-04", name: "100kΩ" },
            { id: "B-01", name: "綠LED" }, { id: "B-02", name: "紅LED" }, { id: "B-03", name: "10µF" }, { id: "B-04", name: "100µF" },
            { id: "C-01", name: "104瓷" }, { id: "C-02", name: "二極體" }, { id: "C-03", name: "555" }, { id: "C-04", name: "電晶體" }
        ];

        // Load DB from localStorage or default
        let currentDB = JSON.parse(localStorage.getItem("zhiku_custom_db")) || DEFAULT_DB;
        let isAdminLoggedIn = localStorage.getItem("zhiku_admin_logged") === "true";
        let curKey = Object.keys(currentDB)[0] || "resistor_10k";
        let isRealCam = false;

        function refreshUIState() {
            // Update admin button UI
            const btn = document.getElementById("adminToggleBtn");
            if (isAdminLoggedIn) {
                btn.className = "admin-btn logged-in";
                btn.innerHTML = "⚙️ 零件庫管理 (已登入)";
            } else {
                btn.className = "admin-btn";
                btn.innerHTML = "🔐 管理員登入";
            }

            // Update DB Status
            const total = Object.keys(currentDB).length;
            document.getElementById("dbStatusBadge").textContent = `DB_RECORDS: ${total} 元件已就緒`;
            document.getElementById("adminDbStat").textContent = `目前零件庫共 ${total} 筆資料 (已同步瀏覽器快取)`;

            // Populate selector
            const sel = document.getElementById("partPick");
            sel.innerHTML = "";
            for (let k in currentDB) {
                const opt = document.createElement("option");
                opt.value = k;
                opt.textContent = `${currentDB[k].name} ➜ ${currentDB[k].box}`;
                sel.appendChild(opt);
            }
            if (!currentDB[curKey]) {
                curKey = Object.keys(currentDB)[0];
            }
            sel.value = curKey;
        }

        function initMiniGrid() {
            const grid = document.getElementById("miniDrawerGrid");
            grid.innerHTML = "";
            M_BOXES.forEach(b => {
                const cell = document.createElement("div");
                cell.className = "mini-cell" + (b.id === (currentDB[curKey]?.box || "A-03") ? " active-drawer" : "");
                cell.id = "m-cell-" + b.id;
                cell.innerHTML = `<span class="cid">${b.id}</span><span class="cname">${b.name}</span>`;
                grid.appendChild(cell);
            });
        }

        function drawMobileCanvas(type) {
            const cvs = document.getElementById("simCanvas");
            const ctx = cvs.getContext("2d");
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            const cx = cvs.width / 2;
            const cy = cvs.height / 2;

            if (type === "resistor") {
                ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(cx - 130, cy); ctx.lineTo(cx + 130, cy); ctx.stroke();
                ctx.fillStyle = "#dcb080";
                ctx.beginPath(); ctx.roundRect(cx - 60, cy - 20, 120, 40, 8); ctx.fill();
                const is10k = (curKey === "resistor_10k");
                const bands = is10k ? ["#5c3a21", "#000000", "#ff7700", "#ffd700"] : ["#d00000", "#d00000", "#5c3a21", "#ffd700"];
                const offsets = [-38, -16, 8, 38];
                bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(cx + offsets[i], cy - 20, 9, 40); });
            } else if (type === "led") {
                ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 3.5;
                ctx.beginPath(); ctx.moveTo(cx - 10, cy + 25); ctx.lineTo(cx - 10, cy + 100); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 10, cy + 25); ctx.lineTo(cx + 10, cy + 80); ctx.stroke();
                ctx.fillStyle = "#ef4444";
                ctx.beginPath(); ctx.arc(cx, cy - 15, 30, Math.PI, 0, false);
                ctx.lineTo(cx + 30, cy + 20); ctx.lineTo(cx - 30, cy + 20); ctx.closePath(); ctx.fill();
            } else if (type === "cap_elec") {
                ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 3.5;
                ctx.beginPath(); ctx.moveTo(cx - 12, cy + 35); ctx.lineTo(cx - 12, cy + 95); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 12, cy + 35); ctx.lineTo(cx + 12, cy + 80); ctx.stroke();
                ctx.fillStyle = "#1e293b"; ctx.beginPath(); ctx.roundRect(cx - 38, cy - 50, 76, 90, 6); ctx.fill();
                ctx.fillStyle = "#e2e8f0"; ctx.fillRect(cx + 16, cy - 50, 14, 90);
                ctx.fillStyle = "#000"; ctx.font = "bold 14px monospace"; ctx.fillText("-", cx + 19, cy);
            } else if (type === "cap_cer") {
                ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(cx - 12, cy + 15); ctx.lineTo(cx - 12, cy + 80); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 12, cy + 15); ctx.lineTo(cx + 12, cy + 80); ctx.stroke();
                ctx.fillStyle = "#d97706"; ctx.beginPath(); ctx.arc(cx, cy - 10, 36, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#000"; ctx.font = "bold 15px monospace"; ctx.fillText("104", cx - 14, cy - 6);
            } else {
                ctx.fillStyle = "#111827"; ctx.beginPath(); ctx.roundRect(cx - 65, cy - 40, 130, 80, 5); ctx.fill();
                ctx.fillStyle = "#cbd5e1";
                for (let i = 0; i < 4; i++) {
                    const px = cx - 48 + i * 32;
                    ctx.fillRect(px, cy - 52, 12, 14);
                    ctx.fillRect(px, cy + 38, 12, 14);
                }
                ctx.fillStyle = "#fff"; ctx.font = "bold 14px monospace"; ctx.fillText("IC CHIP", cx - 30, cy + 5);
            }
        }

        // Voice speech
        function speakSpeech(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'zh-TW';
                utter.rate = 1.05;
                window.speechSynthesis.speak(utter);
            }
        }

        // Auto recognize & speak
        function autoRecognizeAndSpeak(key) {
            curKey = key;
            const item = currentDB[key];
            if (!item) return;

            if (!isRealCam) drawMobileCanvas(item.type || "ic");

            document.getElementById("mConfBadge").textContent = "CONFIDENCE " + (item.conf || "98.0%");
            document.getElementById("mPartName").textContent = item.name;
            document.getElementById("mPartDesc").textContent = item.desc;
            document.getElementById("mDrawerId").textContent = item.box;
            document.getElementById("mVoiceHint").textContent = `🔊 自動播報：「請放入 ${item.box} 號盒」`;
            document.getElementById("activeBoxStatus").textContent = `🟢 ${item.box} 閃爍中`;

            document.querySelectorAll(".mini-cell").forEach(el => el.classList.remove("active-drawer"));
            const target = document.getElementById("m-cell-" + item.box);
            if (target) target.classList.add("active-drawer");

            speakSpeech(item.speech || `辨識成功，${item.name}，請放入${item.box}號盒。`);
        }

        function triggerScanNow() {
            autoRecognizeAndSpeak(curKey);
        }

        // Modal Controls
        function handleAdminBtnClick() {
            if (isAdminLoggedIn) {
                document.getElementById("adminModal").style.display = "flex";
            } else {
                document.getElementById("loginModal").style.display = "flex";
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }

        function submitLogin() {
            const u = document.getElementById("loginUser").value.trim();
            const p = document.getElementById("loginPass").value.trim();

            if (u === "admin" && p === "123456") {
                isAdminLoggedIn = true;
                localStorage.setItem("zhiku_admin_logged", "true");
                closeModal("loginModal");
                refreshUIState();
                alert("驗證成功！已取得庫房管理員權限。");
                document.getElementById("adminModal").style.display = "flex";
            } else {
                alert("帳號或密碼錯誤！(預設: admin / 123456)");
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            localStorage.removeItem("zhiku_admin_logged");
            closeModal("adminModal");
            refreshUIState();
            alert("已成功登出管理員身分。");
        }

        // Database Upload Handlers
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const text = e.target.result;
                    let parsedData = {};

                    if (file.name.endsWith(".json")) {
                        parsedData = JSON.parse(text);
                    } else if (file.name.endsWith(".csv")) {
                        // Parse CSV (key,name,desc,box,speech)
                        const lines = text.split("\n");
                        lines.forEach((line, idx) => {
                            if (idx === 0 || !line.trim()) return; // Skip header
                            const cols = line.split(",");
                            if (cols.length >= 4) {
                                const k = cols[0].trim();
                                parsedData[k] = {
                                    name: cols[1].trim(),
                                    desc: cols[2].trim(),
                                    box: cols[3].trim(),
                                    speech: cols[4] ? cols[4].trim() : `辨識成功，請放入${cols[3].trim()}號盒。`,
                                    conf: "98.5%",
                                    type: "ic"
                                };
                            }
                        });
                    }

                    if (Object.keys(parsedData).length === 0) {
                        throw new Error("檔案內容格式不正確或為空！");
                    }

                    currentDB = parsedData;
                    localStorage.setItem("zhiku_custom_db", JSON.stringify(currentDB));
                    refreshUIState();
                    initMiniGrid();
                    autoRecognizeAndSpeak(Object.keys(currentDB)[0]);

                    alert(`🎉 成功匯入 ${Object.keys(parsedData).length} 筆零件資料！資料庫已即時更新。`);
                    closeModal("adminModal");
                } catch (err) {
                    alert("匯入失敗：" + err.message);
                }
            };
            reader.readAsText(file);
        }

        function exportDatabaseJSON() {
            const blob = new Blob([JSON.stringify(currentDB, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "zhiku_parts_database.json";
            a.click();
            URL.revokeObjectURL(url);
        }

        function resetDefaultDB() {
            if (confirm("確定要還原為系統預設零件庫嗎？自訂的資料將會被覆蓋。")) {
                currentDB = DEFAULT_DB;
                localStorage.removeItem("zhiku_custom_db");
                refreshUIState();
                initMiniGrid();
                autoRecognizeAndSpeak(Object.keys(currentDB)[0]);
                alert("已成功還原為預設零件資料庫！");
            }
        }

        async function toggleRealCam() {
            const vid = document.getElementById("mobileVideo");
            const cvs = document.getElementById("simCanvas");

            if (!isRealCam) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                    vid.srcObject = stream;
                    vid.style.display = "block";
                    cvs.style.display = "none";
                    isRealCam = true;
                } catch (e) {
                    alert("相機啟用失敗：" + e.message);
                }
            } else {
                if (vid.srcObject) {
                    vid.srcObject.getTracks().forEach(t => t.stop());
                }
                vid.style.display = "none";
                cvs.style.display = "block";
                isRealCam = false;
                drawMobileCanvas(currentDB[curKey]?.type || "ic");
            }
        }

        window.onload = function() {
            refreshUIState();
            initMiniGrid();
            drawMobileCanvas(currentDB[curKey]?.type || "ic");
        };
    </script>
</body>
</html>
