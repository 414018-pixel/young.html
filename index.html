<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>青年百億圓夢基金計畫 - 專業申請書系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; margin: 0; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .form-input {
            width: 100%; border-radius: 0.5rem; border: 1px solid #e2e8f0; padding: 0.625rem;
            font-size: 0.875rem; background-color: #f8fafc; transition: all 0.2s; box-sizing: border-box;
        }
        .form-input:focus { outline: none; border-color: #6366f1; background-color: #ffffff; box-shadow: 0 0 0 2px #c7d2fe; }

        /* ======================================================== */
        /* 右側預覽區 (僅供網頁觀看，匯出時會重新渲染) */
        /* ======================================================== */
        .preview-pane {
            background: #cbd5e1; padding: 2rem; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 2rem;
        }
        
        .web-page {
            font-family: 'DFKai-SB', 'BiauKai', '標楷體', serif !important;
            color: black; background: white; 
            width: 100%; max-width: 210mm; /* 模擬 A4 寬度 */
            padding: 2cm 2.5cm; /* 模擬官方邊距 */
            border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: left;
            font-size: 14pt; line-height: 1.5;
        }

        .web-page table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 14pt; }
        .web-page th, .web-page td { border: 1px solid black; padding: 8px; vertical-align: middle; }
        .web-page .no-border th, .web-page .no-border td { border: none !important; }
        
        @media print {
            body * { visibility: hidden; }
            #preview-pane, #preview-pane * { visibility: visible; }
            #preview-pane { position: absolute; left: 0; top: 0; background: white; padding: 0; width: 100%; margin: 0; }
            .web-page { box-shadow: none; margin: 0; width: 210mm; padding: 2cm 2.5cm; }
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col md:flex-row relative">

    <!-- 隱藏區：用來暫存圖片的 Base64 格式，保證轉檔時不會有跨域(CORS)問題 -->
    <div class="hidden">
        <img id="store_id_front" />
        <img id="store_id_back" />
        <img id="store_sig_app" />
        <img id="store_sig_gua" />
    </div>

<!-- STREAMING_CHUNK:Building Left Panel Form... -->
    <!-- ================= 左側：控制面板 ================= -->
    <div class="w-full md:w-5/12 lg:w-1/3 h-full bg-white shadow-2xl flex flex-col z-10 border-r border-gray-200">
        <div class="p-5 bg-white border-b border-gray-200 flex-shrink-0 flex items-center gap-4">
            <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-lg flex items-center justify-center font-bold text-lg">✈️</div>
            <div><h1 class="text-lg font-bold text-gray-900">計畫申請書系統</h1><p class="text-indigo-600 text-xs">智慧排版防腰斬版</p></div>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-6" id="input-form">
            <!-- 1. 基本資料 -->
            <section class="border border-gray-200 p-4 rounded-xl shadow-sm bg-white">
                <h2 class="text-md font-bold text-gray-800 mb-3 border-b pb-2">1. 申請人資料</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs text-gray-500 mb-1">姓名</label><input type="text" id="i_name" class="form-input" oninput="updatePreview()"></div>
                    <div><label class="block text-xs text-gray-500 mb-1">身分證字號</label><input type="text" id="i_id" class="form-input" oninput="updatePreview()"></div>
                    <div><label class="block text-xs text-gray-500 mb-1">出生年月日</label><input type="date" id="i_birth" class="form-input" oninput="updatePreview()"></div>
                    <div><label class="block text-xs text-gray-500 mb-1">手機號碼</label><input type="tel" id="i_phone" class="form-input" oninput="updatePreview()"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-500 mb-1">Email</label><input type="email" id="i_email" class="form-input" oninput="updatePreview()"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-500 mb-1">戶籍地址</label><input type="text" id="i_address" class="form-input" oninput="updatePreview()"></div>
                </div>
                <div class="mt-4 pt-3 border-t">
                    <h3 class="text-xs font-bold text-gray-700 mb-2">緊急連絡人</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div><input type="text" id="i_em_name" class="form-input" placeholder="姓名" oninput="updatePreview()"></div>
                        <div><input type="text" id="i_em_relation" class="form-input" placeholder="關係" oninput="updatePreview()"></div>
                        <div class="col-span-2"><input type="tel" id="i_em_phone" class="form-input" placeholder="連絡電話" oninput="updatePreview()"></div>
                    </div>
                </div>
            </section>

            <!-- 2. 法定代理人 -->
            <section class="border border-gray-200 p-4 rounded-xl shadow-sm bg-white">
                <div class="flex justify-between items-center border-b pb-2 mb-3">
                    <h2 class="text-md font-bold text-gray-800">2. 法定代理人 (未滿18歲)</h2>
                    <input type="checkbox" id="toggle_guardian" onchange="updatePreview()" class="w-5 h-5 cursor-pointer accent-indigo-600">
                </div>
                <div id="guardian_fields" class="hidden grid-cols-2 gap-3">
                    <div><label class="block text-xs text-gray-500 mb-1">姓名</label><input type="text" id="i_g_name" class="form-input" oninput="updatePreview()"></div>
                    <div><label class="block text-xs text-gray-500 mb-1">關係</label><input type="text" id="i_g_relation" class="form-input" oninput="updatePreview()"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-500 mb-1">身分證字號</label><input type="text" id="i_g_id" class="form-input" oninput="updatePreview()"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-500 mb-1">聯絡電話</label><input type="tel" id="i_g_phone" class="form-input" oninput="updatePreview()"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-500 mb-1">聯絡地址</label><input type="text" id="i_g_address" class="form-input" oninput="updatePreview()"></div>
                </div>
            </section>

            <!-- 3. 計畫資訊與圖片 -->
            <section class="border border-gray-200 p-4 rounded-xl shadow-sm bg-white">
                <h2 class="text-md font-bold text-gray-800 mb-3 border-b pb-2">3. 計畫資訊與證件</h2>
                <div class="space-y-3">
                    <div><label class="block text-xs text-gray-500 mb-1">計畫名稱與編號</label><input type="text" id="i_project_name" class="form-input" oninput="updatePreview()"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs text-gray-500 mb-1">正面圖檔</label><input type="file" id="upload_id_front" accept="image/*" class="text-xs w-full"></div>
                        <div><label class="block text-xs text-gray-500 mb-1">反面圖檔</label><input type="file" id="upload_id_back" accept="image/*" class="text-xs w-full"></div>
                    </div>
                </div>
            </section>

            <!-- 4. 內文 -->
            <section class="border border-gray-200 p-4 rounded-xl shadow-sm bg-white">
                <h2 class="text-md font-bold text-gray-800 mb-3 border-b pb-2">4. 申請書內文</h2>
                <div class="space-y-3">
                    <div><label class="block text-sm font-semibold mb-1">1. 學經歷</label><textarea id="i_content_1" rows="3" class="form-input" oninput="updatePreview()"></textarea></div>
                    <div><label class="block text-sm font-semibold mb-1">2. 對計畫了解</label><textarea id="i_content_2" rows="3" class="form-input" oninput="updatePreview()"></textarea></div>
                    <div><label class="block text-sm font-semibold mb-1">3. 動機及期待</label><textarea id="i_content_3" rows="3" class="form-input" oninput="updatePreview()"></textarea></div>
                    <div><label class="block text-sm font-semibold mb-1">4. 未來規劃及影響</label><textarea id="i_content_4" rows="3" class="form-input" oninput="updatePreview()"></textarea></div>
                    <div class="bg-gray-50 p-3 rounded border">
                        <label class="block text-sm font-semibold mb-2">5. 經費需求同意</label>
                        <div class="flex gap-4">
                            <label><input type="radio" name="i_funding" value="agree" checked onchange="updatePreview()"> 同意</label>
                            <label><input type="radio" name="i_funding" value="disagree" onchange="updatePreview()"> 不同意</label>
                        </div>
                    </div>
                    <div><label class="block text-sm font-semibold mb-1">6. 外語證明 (選填)</label><textarea id="i_content_5" rows="2" class="form-input" oninput="updatePreview()"></textarea></div>
                    <div><label class="block text-sm font-semibold mb-1">7. 其他證明 (選填)</label><textarea id="i_content_6" rows="2" class="form-input" oninput="updatePreview()"></textarea></div>
                </div>
            </section>

            <!-- 5. 簽名 -->
            <section class="border border-gray-200 p-4 rounded-xl shadow-sm bg-white pb-8">
                <h2 class="text-md font-bold text-gray-800 mb-3 border-b pb-2">5. 智慧簽章</h2>
                <div class="space-y-4">
                    <div class="bg-white p-3 rounded-lg border shadow-sm flex items-center gap-3">
                        <div id="qr_applicant_box" style="width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; background: #f8fafc; border: 1px solid #e2e8f0;">
                            <div id="qr_applicant"></div>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm">申請人簽章</h3>
                            <button type="button" onclick="openLocalSign('applicant')" class="mt-2 text-xs bg-indigo-600 text-white px-4 py-2 rounded shadow-sm hover:bg-indigo-700 transition font-bold cursor-pointer">點我開啟簽名板</button>
                            <span id="status_applicant_sign" class="text-xs text-green-600 font-bold hidden block mt-1">✅ 簽署完成</span>
                        </div>
                    </div>
                    <div id="qr_guardian_container" class="hidden bg-white p-3 rounded-lg border shadow-sm flex items-center gap-3">
                        <div id="qr_guardian_box" style="width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; background: #f8fafc; border: 1px solid #e2e8f0;">
                            <div id="qr_guardian"></div>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm">法定代理人簽章</h3>
                            <button type="button" onclick="openLocalSign('guardian')" class="mt-2 text-xs bg-indigo-600 text-white px-4 py-2 rounded shadow-sm hover:bg-indigo-700 transition font-bold">點我開啟簽名板</button>
                            <span id="status_guardian_sign" class="text-xs text-green-600 font-bold hidden block mt-1">✅ 簽署完成</span>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div class="p-4 bg-gray-50 border-t flex gap-3 flex-shrink-0">
            <button onclick="exportWord()" class="flex-1 bg-white border border-indigo-600 text-indigo-700 font-bold py-3 rounded-lg hover:bg-indigo-50 shadow-sm transition">📥 匯出 Word</button>
            <button onclick="exportPDF()" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 shadow-sm transition">📥 匯出 PDF</button>
        </div>
    </div>

<!-- STREAMING_CHUNK:Building Preview Area... -->
    <!-- ================= 右側：實體 A4 呈現預覽區 ================= -->
    <div class="w-full md:w-7/12 lg:w-2/3 h-full preview-pane" id="preview-pane">
        <!-- 內容會由 Javascript 即時產生，保證所見即所得 -->
    </div>

<!-- STREAMING_CHUNK:Building Signature Pad... -->
    <!-- ================= 彈出式簽名板 ================= -->
    <div id="mobile_sign_view" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center; padding: 1rem;">
        <div style="background: white; width: 100%; max-width: 500px; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">
            <div style="background: #4f46e5; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 1.1rem; font-weight: bold;" id="mobile_sign_title">請在下方空白處簽名</h3>
                <button type="button" id="btn_mobile_close" style="background: transparent; border: none; color: white; cursor: pointer; font-size: 1rem;">✖</button>
            </div>
            
            <div style="padding: 15px; background: #f8fafc;">
                <div id="canvas_container" style="position: relative; width: 100%; height: 300px; background: white; border: 2px dashed #cbd5e1; border-radius: 8px;">
                    <canvas id="mobile_sign_canvas" style="position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; z-index: 10; cursor: crosshair;"></canvas>
                    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #e2e8f0; font-size: 2rem; font-weight: bold; transform: rotate(-15deg); pointer-events: none; z-index: 1;">簽名區</div>
                </div>
            </div>
            
            <div style="padding: 15px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px;">
                <button type="button" id="btn_mobile_clear" style="flex: 1; padding: 12px; background: #f1f5f9; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #333;">清除重寫</button>
                <button type="button" id="btn_mobile_submit" style="flex: 2; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">確認傳送</button>
            </div>
        </div>
    </div>

<!-- STREAMING_CHUNK:Initializing Core Logic and Render Engine... -->
    <!-- ================= 核心 JavaScript (單一渲染引擎) ================= -->
    <script>
        // ---------------- 日期與核心變數 ----------------
        const today = new Date();
        const dateY = today.getFullYear() - 1911;
        const dateM = today.getMonth() + 1;
        const dateD = today.getDate();

        // ---------------- 圖片上傳轉 DataURL (Base64) ----------------
        function handleImageUpload(inputId, storeId) {
            document.getElementById(inputId).addEventListener('change', e => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        document.getElementById(storeId).src = ev.target.result;
                        updatePreview(); // 上傳完畢立刻更新畫面
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
        handleImageUpload('upload_id_front', 'store_id_front');
        handleImageUpload('upload_id_back', 'store_id_back');

        // ---------------- 終極單一渲染引擎 (產生絕對不會腰斬的 HTML) ----------------
        function getPagesHTML() {
            const isGuardian = document.getElementById('toggle_guardian').checked;
            
            // UI 狀態同步
            document.getElementById('guardian_fields').style.display = isGuardian ? 'grid' : 'none';
            document.getElementById('qr_guardian_container').style.display = isGuardian ? 'flex' : 'none';

            // 輔助函式：抓取文字與圖片
            const getV = (id) => document.getElementById(`i_${id}`)?.value || '&nbsp;';
            const getHTML = (id) => {
                const val = document.getElementById(`i_${id}`)?.value;
                return val ? val.replace(/\n/g, '<br>') : '&nbsp;';
            };
            const getImg = (id) => {
                const src = document.getElementById(id)?.src;
                return src && src.length > 100 ? src : null;
            };
            
            const sigApp = getImg('store_sig_app');
            const sigGua = getImg('store_sig_gua');
            const idFront = getImg('store_id_front');
            const idBack = getImg('store_id_back');

            const chkG = isGuardian ? '[ ☑ ]' : '[ &nbsp; ]';
            const funding = document.querySelector('input[name="i_funding"]:checked')?.value || 'agree';
            const agree = funding === 'agree' ? '[ ☑ ]' : '[ &nbsp; ]';
            const disagree = funding === 'disagree' ? '[ ☑ ]' : '[ &nbsp; ]';

            const pages = [];
            
            // P1: 附件1 檢核清單
            pages.push(`
                <div style="text-align: right; font-size: 12pt; margin-bottom: 10px;">附件1</div>
                <div style="font-size: 18pt; font-weight: bold; text-align: center; margin-bottom: 20px; line-height: 1.5;">教育部青年發展署<br>青年百億海外圓夢基金計畫海外翱翔組<br>申請檢核清單</div>
                <table border="1" cellpadding="6" cellspacing="0">
                    <tr><th style="width: 15%;">檢核(請打勾)</th><th style="width: 35%;">內容</th><th>說明</th></tr>
                    <tr><td style="text-align:center;">[ &nbsp; ]</td><td>申請資料上傳</td><td>請申請人至青年百億海外圓夢基金計畫平臺，登入會員後，填寫相關報名資料。</td></tr>
                    <tr><td style="text-align:center;">[ &nbsp; ]</td><td colspan="2" style="text-align:center; font-weight: bold;">申請文件請於報名期間以PDF檔分別上傳至青年百億海外圓夢基金計畫平臺報名專區</td></tr>
                    <tr><td style="text-align:center;">[ &nbsp; ]</td><td>(1)參與切結書（簽名後掃描電子檔）</td><td>附件2</td></tr>
                    <tr><td style="text-align:center;">[ &nbsp; ]</td><td>(2)特殊身分證明文件掃描影本</td><td>請檢附相關證明文件。</td></tr>
                    <tr><td style="text-align:center;">${chkG}</td><td>(3)法定代理人同意書</td><td>附件3，簽名後掃描電子檔，未成年者務必繳交</td></tr>
                    <tr><td style="text-align:center;">[ ☑ ]</td><td>(4)計畫申請書（含封面及內文）</td><td>附件4、5</td></tr>
                </table>
            `);

            // P2: 附件2 切結書 (高度完美拿捏，避免換頁)
            pages.push(`
                <div style="text-align: right; font-size: 12pt; margin-bottom: 5px;">附件2</div>
                <div style="font-weight: bold; margin-bottom: 5px; font-size: 11pt;">參與切結書（須親筆簽名提供予青年百億海外圓夢基金計畫專案小組。）</div>
                <div style="font-size: 16pt; font-weight: bold; text-align: center; margin: 10px 0;">教育部青年發展署<br>青年百億海外圓夢基金計畫海外翱翔組<br>參與切結書</div>
                <div style="text-indent: 2em; margin-bottom: 8px; font-size: 12pt; text-align: justify; line-height: 1.5;">
                    本人申請教育部青年發展署「115年青年百億海外圓夢基金計畫海外翱翔組」<span style="border-bottom: 1px solid black; padding: 0 5px;">${getV('project_name')}</span>提案。本人確定所填資料及相關附件均屬事實，嗣後如經查，發現有不實情事，本人願負一切法律責任，並繳回已領取獎勵金，特此切結，絕無異議。
                </div>
                <div style="text-indent: 2em; margin-bottom: 8px; font-size: 12pt; text-align: justify; line-height: 1.5;">
                    另，本人同意於提案計畫審查錄取獲實踐獎勵金後，依教育部青年發展署「115年青年百億海外圓夢基金計畫海外翱翔組」相關規定辦理，參與並完成計畫。
                </div>
                <div style="margin-bottom: 10px; font-size: 12pt;">此致<br><span style="padding-left: 2em;">教育部青年發展署</span></div>
                
                <table border="1" cellpadding="4" cellspacing="0" style="width: 60%; margin: 10px 0 10px auto; text-align:center; font-size: 12pt;">
                    <tr><th style="width: 40%; font-weight: normal;">立切結書人</th><td>${getV('name')}</td></tr>
                    <tr><th style="font-weight: normal;">簽章</th><td style="height: 40px; vertical-align: middle;">
                        ${sigApp ? `<img src="${sigApp}" style="max-height: 35px; width: auto;" />` : '<span style="color: #999;">請親筆簽名</span>'}
                    </td></tr>
                </table>
                <div style="text-align: right; margin-bottom: 15px; font-size: 12pt;">中華民國 <span>${dateY}</span> 年 <span>${dateM}</span> 月 <span>${dateD}</span> 日</div>

                <div style="font-size: 14pt; font-weight: bold; margin-bottom: 5px;">一、申請人資料</div>
                <table border="1" cellpadding="6" cellspacing="0" style="width: 100%; text-align:center; font-size: 12pt;">

            tempDiv.style.color = "black";
            tempDiv.style.width = "210mm";
            tempDiv.style.position = 'absolute';
            tempDiv.style.top = '-9999px';
            
            // 注入嚴格的防腰斬 CSS 屬性
            tempDiv.innerHTML = `
                <style>

                    th, td { border: 1px solid black; padding: 8px; vertical-align: middle; }
                    .no-border th, .no-border td { border: none !important; }
                    tr, div.word-page > div { page-break-inside: avoid; } /* 嚴格禁止表格列或段落被從中間切斷 */
                    .html2pdf__page-break { page-break-before: always; height: 0; display: block; }
                </style>
            `;
            
            const pages = getPagesHTML();
            pages.forEach((p, i) => {
                const pageDiv = document.createElement('div');
                pageDiv.innerHTML = p;
                tempDiv.appendChild(pageDiv);
                
                // 除了最後一頁，其他每一頁後面都加上強制換頁符號
                if (i < pages.length - 1) {
                    const breakDiv = document.createElement('div');
                    breakDiv.className = 'html2pdf__page-break';
                    tempDiv.appendChild(breakDiv);
                }
            });

            document.body.appendChild(tempDiv);

            // 將 Margin 參數交給引擎去計算，不要寫死在 HTML 裡
            html2pdf().set({ 
                margin: [20, 25, 20, 25], // 上、右、下、左 (mm) 完全符合公文規範
                filename: '青年百億計畫申請書.pdf', 
                image: { type: 'jpeg', quality: 1 },

                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: 'css' } // 啟用 CSS 智慧分頁
            }).from(tempDiv).save().then(() => {
                document.body.removeChild(tempDiv);
            });

        // ---------------- 畫布與終極簽名 ----------------

        function initCanvasSize() {
            const container = document.getElementById('canvas_container');
            canvas.width = container.clientWidth; 
            canvas.height = container.clientHeight;
            ctx.lineWidth = 4; 
            ctx.lineCap = 'round'; 
            ctx.lineJoin = 'round'; 
            ctx.strokeStyle = '#000000';
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        const start = e => { e.preventDefault(); isDrawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); };
        const draw = e => { e.preventDefault(); if(!isDrawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); };
        const stop = e => { e.preventDefault(); isDrawing = false; ctx.closePath(); };

        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); 
        canvas.addEventListener('mouseup', stop); canvas.addEventListener('mouseout', stop); 
        canvas.addEventListener('touchstart', start, {passive: false}); 
        canvas.addEventListener('touchmove', draw, {passive: false}); 
        canvas.addEventListener('touchend', stop, {passive: false});

        document.getElementById('btn_mobile_clear').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

        function cropSignatureCanvas(canvas, ctx) {
            const w = canvas.width, h = canvas.height;
            if (w === 0 || h === 0) return null;
            const imgData = ctx.getImageData(0, 0, w, h).data;
            let top = null, bottom = null, left = null, right = null;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (imgData[(y * w + x) * 4 + 3] > 0) {
                        if (top === null) top = y; bottom = y;
                        if (left === null || x < left) left = x; if (right === null || x > right) right = x;
                    }
                }
            }
            if (top === null) return null;
            const pad = 20; left = Math.max(0, left - pad); top = Math.max(0, top - pad); right = Math.min(w, right + pad); bottom = Math.min(h, bottom + pad);
            const tCanvas = document.createElement('canvas'); tCanvas.width = right - left; tCanvas.height = bottom - top;
            tCanvas.getContext('2d').drawImage(canvas, left, top, right - left, bottom - top, 0, 0, right - left, bottom - top);
            return tCanvas.toDataURL('image/png');
        }
