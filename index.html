<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>青年百億圓夢基金計畫 - 申請書產生器</title>
    <!-- 引入必備套件 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e2e8f0; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

        /* 左側表單樣式 */
        .form-input {
            width: 100%; border-radius: 0.375rem; border: 1px solid #cbd5e1; padding: 0.5rem;
            font-size: 0.875rem; background-color: #f8fafc; transition: all 0.2s;
        }
        .form-input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 2px #c7d2fe; }

        /* 右側預覽區 (僅供網頁瀏覽) */
        #preview-pane { padding: 2rem; display: flex; flex-direction: column; align-items: center; gap: 2rem; overflow-y: auto; }
        .web-page {
            width: 100%; max-width: 210mm; background: white; padding: 2cm 2.5cm;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-radius: 4px;
            font-family: 'DFKai-SB', 'BiauKai', '標楷體', serif !important;
            font-size: 14pt; line-height: 24pt; color: black; text-align: justify;
        }
        .web-page table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 14pt; }
        .web-page th, .web-page td { border: 1px solid black; padding: 8px; vertical-align: middle; text-align: center; }
        .web-page .no-border td { border: none !important; text-align: left; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- ================= 左側控制面板 ================= -->
    <div class="w-full md:w-5/12 lg:w-1/3 h-full bg-white shadow-2xl flex flex-col z-20 border-r">
        <div class="p-4 bg-indigo-700 text-white flex justify-between items-center shrink-0">
            <h1 class="text-lg font-bold tracking-wider">計畫申請書系統</h1>
            <span class="text-xs bg-indigo-500 px-2 py-1 rounded">完美重製版</span>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-6" id="form-container">
            <!-- 1. 基本資料 -->
            <div class="border rounded-xl p-4 bg-gray-50">
                <h2 class="font-bold text-gray-800 border-b pb-2 mb-3">1. 申請人資料</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs text-gray-600 mb-1">姓名</label><input type="text" id="v_name" class="form-input"></div>
                    <div><label class="block text-xs text-gray-600 mb-1">身分證字號</label><input type="text" id="v_id" class="form-input"></div>
                    <div><label class="block text-xs text-gray-600 mb-1">出生年月日</label><input type="date" id="v_birth" class="form-input"></div>
                    <div><label class="block text-xs text-gray-600 mb-1">手機號碼</label><input type="tel" id="v_phone" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-600 mb-1">Email</label><input type="email" id="v_email" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-600 mb-1">戶籍地址 (含郵遞區號)</label><input type="text" id="v_address" class="form-input"></div>
                </div>
                <div class="mt-4 pt-3 border-t">
                    <label class="block text-xs font-bold text-gray-700 mb-2">緊急連絡人</label>
                    <div class="grid grid-cols-2 gap-3">
                        <div><input type="text" id="v_em_name" class="form-input" placeholder="姓名"></div>
                        <div><input type="text" id="v_em_relation" class="form-input" placeholder="關係"></div>
                        <div class="col-span-2"><input type="tel" id="v_em_phone" class="form-input" placeholder="連絡電話"></div>
                    </div>
                </div>
            </div>

            <!-- 2. 法定代理人 -->
            <div class="border rounded-xl p-4 bg-gray-50">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-gray-800">2. 法定代理人 (未滿18歲)</h2>
                    <input type="checkbox" id="v_is_guardian" class="w-5 h-5 cursor-pointer">
                </div>
                <div id="guardian_box" class="hidden grid-cols-2 gap-3 pt-2 border-t">
                    <div><label class="block text-xs text-gray-600 mb-1">姓名</label><input type="text" id="v_g_name" class="form-input"></div>
                    <div><label class="block text-xs text-gray-600 mb-1">關係</label><input type="text" id="v_g_relation" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-600 mb-1">身分證字號</label><input type="text" id="v_g_id" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-600 mb-1">聯絡電話</label><input type="tel" id="v_g_phone" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs text-gray-600 mb-1">聯絡地址</label><input type="text" id="v_g_address" class="form-input"></div>
                </div>
            </div>

            <!-- 3. 計畫資訊與圖片 -->
            <div class="border rounded-xl p-4 bg-gray-50">
                <h2 class="font-bold text-gray-800 border-b pb-2 mb-3">3. 計畫資訊與證件</h2>
                <div class="space-y-3">
                    <div><label class="block text-xs text-gray-600 mb-1">計畫名稱與編號</label><input type="text" id="v_project_name" class="form-input"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs text-gray-600 mb-1">身分證正面</label><input type="file" id="file_front" accept="image/*" class="text-xs"></div>
                        <div><label class="block text-xs text-gray-600 mb-1">身分證反面</label><input type="file" id="file_back" accept="image/*" class="text-xs"></div>
                    </div>
                </div>
            </div>

            <!-- 4. 內文 -->
            <div class="border rounded-xl p-4 bg-gray-50">
                <h2 class="font-bold text-gray-800 border-b pb-2 mb-3">4. 申請書內文</h2>
                <div class="space-y-4">
                    <div><label class="block text-sm font-bold mb-1">1. 學經歷</label><textarea id="v_content_1" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-sm font-bold mb-1">2. 對計畫了解</label><textarea id="v_content_2" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-sm font-bold mb-1">3. 動機及期待</label><textarea id="v_content_3" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-sm font-bold mb-1">4. 未來規劃及影響</label><textarea id="v_content_4" rows="2" class="form-input"></textarea></div>
                    <div class="bg-white p-3 rounded border">
                        <label class="block text-sm font-bold mb-2">5. 經費需求同意書</label>
                        <div class="flex gap-4">
                            <label><input type="radio" name="v_funding" value="agree" checked> 同意</label>
                            <label><input type="radio" name="v_funding" value="disagree"> 不同意</label>
                        </div>
                    </div>
                    <div><label class="block text-sm font-bold mb-1">6. 外語證明 (選填)</label><textarea id="v_content_5" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-sm font-bold mb-1">7. 其他證明 (選填)</label><textarea id="v_content_6" rows="2" class="form-input"></textarea></div>
                </div>
            </div>

            <!-- 5. 簽名區 -->
            <div class="border rounded-xl p-4 bg-gray-50 pb-8">
                <h2 class="font-bold text-gray-800 border-b pb-2 mb-3">5. 智慧簽章區</h2>
                <div class="space-y-4">
                    <!-- 申請人簽章 -->
                    <div class="bg-white p-3 rounded border flex gap-4 items-center">
                        <div id="qr_app_box" class="w-[80px] h-[80px] flex items-center justify-center bg-gray-100 border p-1"></div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm">申請人簽章</h3>
                            <button onclick="openSignModal('app')" class="mt-2 text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-1.5 rounded hover:bg-indigo-200">滑鼠簽名</button>
                            <span id="status_app" class="text-xs text-green-600 font-bold hidden block mt-1">✅ 簽署完成</span>
                        </div>
                    </div>
                    <!-- 法代簽章 -->
                    <div id="qr_gua_container" class="hidden bg-white p-3 rounded border flex gap-4 items-center">
                        <div id="qr_gua_box" class="w-[80px] h-[80px] flex items-center justify-center bg-gray-100 border p-1"></div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm">法定代理人簽章</h3>
                            <button onclick="openSignModal('gua')" class="mt-2 text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-1.5 rounded hover:bg-indigo-200">滑鼠簽名</button>
                            <span id="status_gua" class="text-xs text-green-600 font-bold hidden block mt-1">✅ 簽署完成</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="p-4 bg-white border-t flex gap-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] shrink-0">
            <button onclick="ExportManager.downloadWord()" class="flex-1 bg-white border-2 border-indigo-600 text-indigo-700 font-bold py-3 rounded-lg hover:bg-indigo-50 transition">📥 匯出 Word</button>
            <button onclick="ExportManager.downloadPDF()" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">📥 匯出 PDF</button>
        </div>
    </div>

    <!-- ================= 右側預覽區 ================= -->
    <div class="w-full md:w-7/12 lg:w-2/3 h-full preview-pane bg-slate-300" id="preview-pane">
        <!-- 內容由 JS 即時渲染 -->
    </div>

    <!-- ================= 簽名畫布彈出視窗 ================= -->
    <div id="sign_modal" class="hidden fixed inset-0 bg-black/60 z-[9999] flex items-center justify-center p-4">
        <div class="bg-white rounded-lg w-full max-w-lg flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-indigo-600 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold" id="sign_title">請簽名</h3>
                <button onclick="closeSignModal()" class="text-white font-bold text-xl hover:text-gray-200">&times;</button>
            </div>
            <div class="p-4 bg-gray-50">
                <div id="canvas_wrap" class="w-full h-[300px] bg-white border-2 border-dashed border-gray-300 rounded relative">
                    <canvas id="sign_canvas" class="absolute inset-0 w-full h-full touch-none z-10 cursor-crosshair"></canvas>
                    <div class="absolute inset-0 flex items-center justify-center text-gray-200 text-3xl font-bold -rotate-12 select-none z-0">簽名區</div>
                </div>
            </div>
            <div class="px-4 py-3 bg-white border-t flex gap-3">
                <button onclick="clearCanvas()" class="flex-1 py-2 bg-gray-100 font-bold text-gray-700 rounded hover:bg-gray-200">清除重寫</button>
                <button id="btn_save_sign" class="flex-[2] py-2 bg-indigo-600 font-bold text-white rounded hover:bg-indigo-700">確認儲存</button>
            </div>
        </div>
    </div>

    <!-- ================= 系統核心架構 ================= -->
    <script>
        // --- 1. 全域資料庫 (單一真相來源) ---
        const AppData = {
            v_name: '', v_id: '', v_birth: '', v_phone: '', v_email: '', v_address: '',
            v_em_name: '', v_em_relation: '', v_em_phone: '',
            v_is_guardian: false,
            v_g_name: '', v_g_relation: '', v_g_id: '', v_g_phone: '', v_g_address: '',
            v_project_name: '', 
            v_content_1: '', v_content_2: '', v_content_3: '', v_content_4: '', v_content_5: '', v_content_6: '',
            v_funding: 'agree',
            img_front: null, img_back: null, sig_app: null, sig_gua: null,
            dateY: new Date().getFullYear() - 1911, dateM: new Date().getMonth() + 1, dateD: new Date().getDate()
        };

        // --- 2. 監聽與綁定 ---
        const textInputs = ['v_name', 'v_id', 'v_birth', 'v_phone', 'v_email', 'v_address', 'v_em_name', 'v_em_relation', 'v_em_phone', 'v_g_name', 'v_g_relation', 'v_g_id', 'v_g_phone', 'v_g_address', 'v_project_name', 'v_content_1', 'v_content_2', 'v_content_3', 'v_content_4', 'v_content_5', 'v_content_6'];
        textInputs.forEach(id => {
            document.getElementById(id).addEventListener('input', e => {
                AppData[id] = e.target.value;
                Renderer.updatePreview();
            });
        });

        document.getElementById('v_is_guardian').addEventListener('change', e => {
            AppData.v_is_guardian = e.target.checked;
            document.getElementById('guardian_box').style.display = AppData.v_is_guardian ? 'grid' : 'none';
            document.getElementById('qr_gua_container').style.display = AppData.v_is_guardian ? 'flex' : 'none';
            Renderer.updatePreview();
        });

        document.querySelectorAll('input[name="v_funding"]').forEach(el => {
            el.addEventListener('change', e => { AppData.v_funding = e.target.value; Renderer.updatePreview(); });
        });

        function handleFile(inputId, key) {
            document.getElementById(inputId).addEventListener('change', e => {
                const file = e.target.files[0];
                if(file){
                    const r = new FileReader();
                    r.onload = ev => { AppData[key] = ev.target.result; Renderer.updatePreview(); };
                    r.readAsDataURL(file);
                }
            });
        }
        handleFile('file_front', 'img_front');
        handleFile('file_back', 'img_back');


        // --- 3. 核心模板引擎 (負責生成所有 HTML) ---
        const Template = {
            getVal: (key) => AppData[key] || '',
            getHtml: (key) => AppData[key] ? AppData[key].replace(/\n/g, '<br>') : '',
            getImg: (key, emptyText) => AppData[key] ? `<img src="${AppData[key]}" style="max-height:100%; max-width:100%; object-fit:contain;" />` : `<span style="color:#999;">${emptyText}</span>`,
            getSig: (key) => AppData[key] ? `<img src="${AppData[key]}" style="max-height:40px; width:auto;" />` : `<span style="color:#999;">請親筆簽名</span>`,

            generatePages: function() {
                const d = AppData;
                const chkG = d.v_is_guardian ? '☑' : '&nbsp;&nbsp;';
                const agree = d.v_funding === 'agree' ? '☑' : '&nbsp;&nbsp;';
                const disagree = d.v_funding === 'disagree' ? '☑' : '&nbsp;&nbsp;';

                const pages = [];

                // Page 1: 檢核清單
                pages.push(`
                    <div style="text-align:right; font-size:12pt; margin-bottom:10px;">附件1</div>
                    <div style="text-align:center; font-size:18pt; font-weight:bold; margin-bottom:20px;">教育部青年發展署<br>青年百億海外圓夢基金計畫海外翱翔組<br>申請檢核清單</div>
                    <table border="1">
                        <tr><th style="width:15%;">檢核(請打勾)</th><th style="width:35%;">內容</th><th>說明</th></tr>
                        <tr><td>[ &nbsp;&nbsp; ]</td><td>申請資料上傳</td><td style="text-align:left;">請申請人至平臺登入填寫。</td></tr>
                        <tr><td>[ &nbsp;&nbsp; ]</td><td colspan="2" style="font-weight:bold;">申請文件請於報名期間以PDF檔上傳至報名專區</td></tr>
                        <tr><td>[ &nbsp;&nbsp; ]</td><td>(1)參與切結書</td><td style="text-align:left;">附件2</td></tr>
                        <tr><td>[ &nbsp;&nbsp; ]</td><td>(2)特殊身分證明文件</td><td style="text-align:left;">請檢附相關證明文件。</td></tr>
                        <tr><td>[ ${chkG} ]</td><td>(3)法定代理人同意書</td><td style="text-align:left;">附件3，未成年者務必繳交</td></tr>
                        <tr><td>[ ☑ ]</td><td>(4)計畫申請書</td><td style="text-align:left;">附件4、5</td></tr>
                    </table>
                `);

                // Page 2: 切結書
                pages.push(`
                    <div style="text-align:right; font-size:12pt;">附件2</div>
                    <div style="font-weight:bold; font-size:12pt; margin-bottom:10px;">參與切結書（須親筆簽名提供予青年百億海外圓夢基金計畫專案小組。）</div>
                    <div style="text-align:center; font-size:16pt; font-weight:bold; margin-bottom:20px;">教育部青年發展署<br>青年百億海外圓夢基金計畫海外翱翔組<br>參與切結書</div>
                    <div style="text-indent:2em; text-align:justify; margin-bottom:10px;">
                        本人申請教育部青年發展署「115年青年百億海外圓夢基金計畫海外翱翔組」<span style="border-bottom:1px solid black; padding:0 5px;">${this.getVal('v_project_name')}</span>提案。本人確定所填資料均屬事實，嗣後如經查發現不實，願負一切法律責任並繳回獎勵金，特此切結。
                    </div>
                    <div style="text-indent:2em; text-align:justify; margin-bottom:20px;">
                        另同意於審查錄取後，依相關規定參與並完成計畫。
                    </div>
                    <div style="margin-bottom:20px;">此致<br><span style="padding-left:2em;">教育部青年發展署</span></div>
                    <table border="1" style="width:60%; margin:0 0 20px auto;">
                        <tr><th style="width:40%; font-weight:normal;">立切結書人</th><td>${this.getVal('v_name')}</td></tr>
                        <tr><th style="font-weight:normal;">簽章</th><td style="height:50px;">${this.getSig('sig_app')}</td></tr>
                    </table>
                    <div style="text-align:right; margin-bottom:20px;">中華民國 <span>${d.dateY}</span> 年 <span>${d.dateM}</span> 月 <span>${d.dateD}</span> 日</div>
                    <div style="font-weight:bold; margin-bottom:5px;">一、申請人資料</div>
                    <table border="1" style="font-size:12pt;">
                        <tr><th rowspan="2" style="width:15%; font-weight:normal;">立切結書人</th><th style="font-weight:normal;">姓名</th><th style="font-weight:normal;">身分證字號</th><th style="font-weight:normal;">出生年月日</th><th style="font-weight:normal;">手機號碼</th><th colspan="2" style="font-weight:normal;">戶籍地址</th></tr>
                        <tr><td style="height:30px;">${this.getVal('v_name')}</td><td>${this.getVal('v_id')}</td><td>${this.getVal('v_birth')}</td><td>${this.getVal('v_phone')}</td><td colspan="2" style="text-align:left;">${this.getVal('v_address')}</td></tr>
                        <tr><th rowspan="2" style="font-weight:normal;">緊急連絡人</th><th style="font-weight:normal;">姓名</th><th style="font-weight:normal;">關係</th><th colspan="4" style="font-weight:normal;">連絡電話</th></tr>
                        <tr><td style="height:30px;">${this.getVal('v_em_name')}</td><td>${this.getVal('v_em_relation')}</td><td colspan="4">${this.getVal('v_em_phone')}</td></tr>
                    </table>
                    <div style="margin-top:10px;">計畫編號：<span style="border-bottom:1px solid black; padding:0 10px;">${this.getVal('v_project_name')}</span></div>
                `);

                // Page 3: 身分證
                pages.push(`
                    <div style="font-weight:bold; font-size:16pt; margin-bottom:20px;">二、請提供身分證正反面影本</div>
                    <table border="1">
                        <tr><th style="width:25%; font-weight:normal;">立切結書人</th><th style="font-weight:normal;">證件正反面影本</th></tr>
                        <tr>
                            <td style="font-weight:bold; font-size:16pt;">${this.getVal('v_name')}</td>
                            <td style="padding:20px;">
                                <div style="border:1px solid black; width:300px; height:180px; margin:0 auto 20px auto; display:flex; justify-content:center; align-items:center;">
                                    ${this.getImg('img_front', '正面影本放置處')}
                                </div>
                                <div style="border:1px solid black; width:300px; height:180px; margin:0 auto; display:flex; justify-content:center; align-items:center;">
                                    ${this.getImg('img_back', '反面影本放置處')}
                                </div>
                            </td>
                        </tr>
                    </table>
                    <div style="margin-top:15px; font-size:12pt;">附註：本表填妥後請於報名期間以PDF檔上傳。</div>
                `);

                // Page 4: 法代 (若有勾選)
                if (d.v_is_guardian) {
                    pages.push(`
                        <div style="text-align:right; font-size:12pt;">附件3</div>
                        <div style="font-weight:bold; font-size:12pt; margin-bottom:20px;">法定代理人同意書</div>
                        <div style="text-align:center; font-size:18pt; font-weight:bold; margin-bottom:30px;">教育部青年發展署<br>115年青年百億海外圓夢基金計畫海外翱翔組<br>法定代理人同意書</div>
                        <div style="text-indent:2em; text-align:justify; margin-bottom:30px; line-height:1.8;">

        };
        // 初次渲染
        Renderer.updatePreview();

        const ExportManager = {
            downloadWord: function() {
                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><style>
                    @page { size: 21cm 29.7cm; margin: 2.5cm; }
                    body { font-family: '標楷體', DFKai-SB, serif; font-size: 14pt; line-height: 24pt; color: black; }

                    .no-border td { border: none !important; text-align: left; }
                </style></head><body>`;
                
                let bodyHtml = '';
                const pages = Template.generatePages();
                pages.forEach((p, idx) => {
                    if(idx > 0) bodyHtml += `<br clear="all" style="page-break-before:always;" />`;
                    bodyHtml += `<div>${p}</div>`;
                });
                
                const blob = new Blob(['\ufeff', header + bodyHtml + '</body></html>'], { type: 'application/msword' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(blob); 
                link.download = '青年百億計畫申請書.doc'; link.click();
            },
            
            downloadPDF: function() {
                // 產生一個純淨的、絕對 210mm 寬度的隱藏容器給 PDF 截圖
                const container = document.createElement('div');
                container.style.position = 'absolute';
                container.style.top = '-9999px';
                container.style.width = '210mm';
                container.style.backgroundColor = 'white';
                container.style.fontFamily = "'DFKai-SB', 'BiauKai', '標楷體', serif";
                container.style.fontSize = "14pt";
                container.style.color = "black";
                
                // 加入嚴格防腰斬的 CSS
                container.innerHTML = `<style>
                    table { border-collapse: collapse; width: 100%; }
                    th, td { border: 1px solid black; padding: 8px; text-align: center; vertical-align: middle; }
                    .no-border td { border: none !important; text-align: left; }

                const pages = Template.generatePages();
                pages.forEach((p, idx) => {
                    if (idx > 0) {

                    }
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'pdf-page';
                    pageDiv.innerHTML = p;
                    container.appendChild(pageDiv);
                });

                document.body.appendChild(container);

                html2pdf().set({

                    html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },

        // --- 5. 簽名板與連線機制 (最精簡、不報錯) ---
        const canvas = document.getElementById('sign_canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, currentSignRole = '';

        function resizeCanvas() {
            const wrap = document.getElementById('canvas_wrap');
            canvas.width = wrap.clientWidth; canvas.height = wrap.clientHeight;
            ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = 'black';
        }

        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: cx - r.left, y: cy - r.top };
        }

        canvas.addEventListener('pointerdown', e => { e.preventDefault(); isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
        canvas.addEventListener('pointermove', e => { e.preventDefault(); if(!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
        canvas.addEventListener('pointerup', () => { isDrawing = false; ctx.closePath(); });
        canvas.addEventListener('pointerout', () => { isDrawing = false; });
        
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function openSignModal(role) {
            currentSignRole = role;
            document.getElementById('sign_title').innerText = role === 'app' ? '申請人簽名' : '法定代理人簽名';
            document.getElementById('sign_modal').style.display = 'flex';
            setTimeout(resizeCanvas, 100);
        }
        function closeSignModal() { document.getElementById('sign_modal').style.display = 'none'; clearCanvas(); }

        function saveSignature() {
            // 裁切空白
            let top=null, bottom=null, left=null, right=null;
            const w = canvas.width, h = canvas.height, imgData = ctx.getImageData(0,0,w,h).data;
            for(let y=0; y<h; y++) {
                for(let x=0; x<w; x++) {
                    if(imgData[(y*w+x)*4+3] > 0) {
                        if(top===null) top=y; bottom=y;
                        if(left===null || x<left) left=x; if(right===null || x>right) right=x;
                    }
                }
            }
            if(top===null) { alert('請先簽名！'); return; }
            
            const pad = 10; left = Math.max(0, left-pad); top = Math.max(0, top-pad); right = Math.min(w, right+pad); bottom = Math.min(h, bottom+pad);
            const tc = document.createElement('canvas'); tc.width = right-left; tc.height = bottom-top;
            tc.getContext('2d').drawImage(canvas, left, top, right-left, bottom-top, 0, 0, right-left, bottom-top);
            const dataUrl = tc.toDataURL('image/png');

            if(currentSignRole === 'app') { AppData.sig_app = dataUrl; document.getElementById('status_app').style.display = 'block'; document.getElementById('qr_app_box').style.display = 'none'; }
            else { AppData.sig_gua = dataUrl; document.getElementById('status_gua').style.display = 'block'; document.getElementById('qr_gua_box').style.display = 'none'; }
            
            Renderer.updatePreview(); closeSignModal();
        }
        document.getElementById('btn_save_sign').addEventListener('click', saveSignature);

        // QR Code 產生

            new QRCode(document.getElementById("qr_guardian"), { text: `${baseUrl}?role=gua`, width: 70, height: 70 });
        }, 500);

    </script>
