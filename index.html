<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>智庫管家 Mobile - AI零件辨識系統</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #151d2e;
            --card-inner: #0d131f;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-ui: #222f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .mobile-shell {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            position: relative;
            padding-bottom: 24px;
        }

        /* Top Nav */
        .app-bar {
            padding: 14px 18px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-ui);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .app-title-group h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .app-title-group p {
            font-size: 0.72rem;
            color: var(--text-sub);
        }

        .team-chip {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(16, 185, 129, 0.2));
            border: 1px solid rgba(6, 182, 212, 0.4);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        /* Camera Viewport */
        .cam-frame {
            position: relative;
            margin: 12px 16px 8px;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4 / 3;
            border: 1.5px solid var(--border-ui);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #mobileVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #simCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #070b12;
        }

        /* Scanner HUD */
        .scan-overlay {
            position: absolute;
            inset: 16px;
            border: 1.5px dashed rgba(6, 182, 212, 0.5);
            border-radius: 12px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }

        .scan-laser-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-cyan);
            animation: moveLaser 2.2s infinite ease-in-out alternate;
        }

        @keyframes moveLaser {
            0% { top: 8%; opacity: 0.2; }
            50% { opacity: 1; }
            100% { top: 92%; opacity: 0.2; }
        }

        .cam-top-badge {
            align-self: flex-start;
            background: rgba(0, 0, 0, 0.65);
            color: var(--accent-cyan);
            font-size: 0.68rem;
            padding: 3px 6px;
            border-radius: 4px;
            font-family: monospace;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        /* Floating controls on camera */
        .cam-tools {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
        }

        .tool-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-ui);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        /* Main Result Block */
        .info-container {
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-ui);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .part-details {
            flex: 1;
        }

        .conf-badge {
            font-size: 0.7rem;
            color: var(--accent-cyan);
            font-weight: 700;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 2px;
        }

        .part-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
        }

        .part-desc {
            font-size: 0.78rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* Target Drawer Big Indicator */
        .drawer-box-indicator {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(6, 182, 212, 0.15));
            border: 2px solid var(--accent-green);
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
            min-width: 90px;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.25);
        }

        .drawer-box-label {
            font-size: 0.65rem;
            color: var(--accent-green);
            font-weight: 700;
        }

        .drawer-box-id {
            font-size: 1.6rem;
            font-weight: 900;
            color: #fff;
            font-family: monospace;
            line-height: 1.1;
        }

        /* Drawer Mini Matrix */
        .matrix-section {
            background: var(--card-inner);
            border: 1px solid var(--border-ui);
            border-radius: 14px;
            padding: 12px;
        }

        .matrix-head {
            font-size: 0.76rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .drawer-grid-mini {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .mini-cell {
            background: #141c2c;
            border: 1px solid var(--border-ui);
            border-radius: 6px;
            padding: 6px 4px;
            text-align: center;
            transition: all 0.2s;
        }

        .mini-cell .cid {
            font-size: 0.68rem;
            font-family: monospace;
            font-weight: 700;
            color: var(--text-sub);
        }

        .mini-cell .cname {
            font-size: 0.62rem;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .mini-cell.active-drawer {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
        .mini-cell.active-drawer .cid {
            color: var(--accent-green);
        }

        /* Bottom Floating Bar */
        .bottom-actions {
            margin-top: auto;
            padding: 12px 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .main-scan-btn {
            background: linear-gradient(135deg, #0284c7, #06b6d4);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
            cursor: pointer;
        }

        .demo-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .demo-select {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-ui);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="mobile-shell">
        <!-- Top Nav -->
        <header class="app-bar">
            <div class="app-title-group">
                <h1>智庫管家 <span>Mobile</span></h1>
                <p>AI 零件即時辨識與智能歸位</p>
            </div>
            <div class="team-chip">
                明星三缺一 ｜ 資訊組
            </div>
        </header>

        <!-- Camera Area -->
        <div class="cam-frame">
            <video id="mobileVideo" autoplay playsinline muted></video>
            <canvas id="simCanvas" width="480" height="360"></canvas>

            <div class="scan-overlay">
                <div class="cam-top-badge">FPS 30.2 ｜ 38ms ｜ TF.JS</div>
                <div class="scan-laser-line"></div>
                <div class="cam-top-badge" style="align-self:flex-end;">TARGET_LOCKED</div>
            </div>

            <div class="cam-tools">
                <button class="tool-btn" onclick="toggleRealCam()">📷 切換真鏡頭</button>
            </div>
        </div>

        <!-- Result Container -->
        <div class="info-container">
            <!-- Part card -->
            <div class="result-card">
                <div class="part-details">
                    <span class="conf-badge" id="mConfBadge">CONFIDENCE 98.4%</span>
                    <h2 class="part-name" id="mPartName">10kΩ 四環電阻</h2>
                    <p class="part-desc" id="mPartDesc">色碼：棕 · 黑 · 橙 · 金 (±5%)</p>
                    <p style="font-size:0.75rem; color:#38bdf8; margin-top:6px;" id="mVoiceHint">🔊 語音：「請放入 A 區 3 號盒」</p>
                </div>
                <div class="drawer-box-indicator">
                    <div class="drawer-box-label">建議盒號</div>
                    <div class="drawer-box-id" id="mDrawerId">A-03</div>
                </div>
            </div>

            <!-- Mini Grid -->
            <div class="matrix-section">
                <div class="matrix-head">
                    <span>🗄️ 實習工場零件櫃座標矩陣 (A / B / C 區)</span>
                    <span style="color:var(--accent-green);">🟢 導引中</span>
                </div>
                <div class="drawer-grid-mini" id="miniDrawerGrid"></div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="bottom-actions">
            <div class="demo-bar">
                <span>切換展示元件：</span>
                <select class="demo-select" id="partPick" onchange="switchMobilePart(this.value)">
                    <option value="resistor_10k">10kΩ 電阻 ➜ A-03</option>
                    <option value="resistor_220">220Ω 電阻 ➜ A-01</option>
                    <option value="led_red">紅色 LED ➜ B-02</option>
                    <option value="cap_electrolytic">100µF 電解電容 ➜ B-04</option>
                    <option value="cap_ceramic">104 陶瓷電容 ➜ C-01</option>
                    <option value="ic_ne555">NE555 定時 IC ➜ C-03</option>
                </select>
            </div>
            <button class="main-scan-btn" onclick="triggerMobileScan()">
                <span>⚡ 對準零件立即歸位 (語音播報)</span>
            </button>
        </div>
    </div>

    <script>
        const M_DATA = {
            "resistor_10k": { name: "10kΩ 四環電阻", desc: "色碼：棕 · 黑 · 橙 · 金 (±5%)", box: "A-03", conf: "98.4%", type: "resistor", speech: "辨識完成，10k歐姆電阻，請放入A區3號盒。" },
            "resistor_220": { name: "220Ω 四環電阻", desc: "色碼：紅 · 紅 · 棕 · 金 (±5%)", box: "A-01", conf: "97.1%", type: "resistor", speech: "辨識完成，220歐姆限流電阻，請放入A區1號盒。" },
            "led_red": { name: "5mm 紅色 LED", desc: "長正短負 / 順向電壓約 2V", box: "B-02", conf: "99.2%", type: "led", speech: "偵測到紅色發光二極體，長腳為正極，請放入B區2號盒。" },
            "cap_electrolytic": { name: "100µF 電解電容", desc: "有極性！灰條標示為負極(-)", box: "B-04", conf: "96.5%", type: "cap_elec", speech: "注意！100微法拉電解電容，有正負極區分，請放入B區4號盒。" },
            "cap_ceramic": { name: "104 陶瓷電容", desc: "無極性 / 容值 0.1µF 去耦電容", box: "C-01", conf: "95.8%", type: "cap_cer", speech: "104陶瓷去耦電容，請歸入C區1號盒。" },
            "ic_ne555": { name: "NE555 定時 IC", desc: "DIP-8 封裝 / 缺口左側為第1腳", box: "C-03", conf: "98.9%", type: "ic", speech: "NE555定時IC，請注意引腳方向，放入C區3號IC盒。" }
        };

        const M_BOXES = [
            { id: "A-01", name: "220Ω" }, { id: "A-02", name: "1kΩ" }, { id: "A-03", name: "10kΩ" }, { id: "A-04", name: "100kΩ" },
            { id: "B-01", name: "綠LED" }, { id: "B-02", name: "紅LED" }, { id: "B-03", name: "10µF" }, { id: "B-04", name: "100µF" },
            { id: "C-01", name: "104瓷" }, { id: "C-02", name: "二極體" }, { id: "C-03", name: "555" }, { id: "C-04", name: "電晶體" }
        ];

        let curKey = "resistor_10k";
        let isRealCam = false;

        function initMiniGrid() {
            const grid = document.getElementById("miniDrawerGrid");
            grid.innerHTML = "";
            M_BOXES.forEach(b => {
                const cell = document.createElement("div");
                cell.className = "mini-cell" + (b.id === "A-03" ? " active-drawer" : "");
                cell.id = "m-cell-" + b.id;
                cell.innerHTML = `<span class="cid">${b.id}</span><span class="cname">${b.name}</span>`;
                grid.appendChild(cell);
            });
        }

        function drawMobileCanvas(type) {
            const cvs = document.getElementById("simCanvas");
            const ctx = cvs.getContext("2d");
            ctx.clearRect(0, 0, cvs.width, cvs.height);

            const cx = cvs.width / 2;
            const cy = cvs.height / 2;

            // Background subtle grid
            ctx.strokeStyle = "#131c2a";
            for (let x = 0; x < cvs.width; x += 24) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cvs.height); ctx.stroke(); }
            for (let y = 0; y < cvs.height; y += 24) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cvs.width, y); ctx.stroke(); }

            if (type === "resistor") {
                ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(cx - 130, cy); ctx.lineTo(cx + 130, cy); ctx.stroke();
                ctx.fillStyle = "#dcb080";
                ctx.beginPath(); ctx.roundRect(cx - 60, cy - 20, 120, 40, 8); ctx.fill();
                const is10k = (curKey === "resistor_10k");
                const bands = is10k ? ["#5c3a21", "#000000", "#ff7700", "#ffd700"] : ["#d00000", "#d00000", "#5c3a21", "#ffd700"];
                const offsets = [-38, -16, 8, 38];
                bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(cx + offsets[i], cy - 20, 9, 40); });
            } else if (type === "led") {
                ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 3.5;
                ctx.beginPath(); ctx.moveTo(cx - 10, cy + 25); ctx.lineTo(cx - 10, cy + 100); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 10, cy + 25); ctx.lineTo(cx + 10, cy + 80); ctx.stroke();
                ctx.fillStyle = "#ef4444";
                ctx.beginPath(); ctx.arc(cx, cy - 15, 30, Math.PI, 0, false);
                ctx.lineTo(cx + 30, cy + 20); ctx.lineTo(cx - 30, cy + 20); ctx.closePath(); ctx.fill();
            } else if (type === "cap_elec") {
                ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 3.5;
                ctx.beginPath(); ctx.moveTo(cx - 12, cy + 35); ctx.lineTo(cx - 12, cy + 95); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 12, cy + 35); ctx.lineTo(cx + 12, cy + 80); ctx.stroke();
                ctx.fillStyle = "#1e293b"; ctx.beginPath(); ctx.roundRect(cx - 38, cy - 50, 76, 90, 6); ctx.fill();
                ctx.fillStyle = "#e2e8f0"; ctx.fillRect(cx + 16, cy - 50, 14, 90);
                ctx.fillStyle = "#000"; ctx.font = "bold 14px monospace"; ctx.fillText("-", cx + 19, cy);
            } else if (type === "cap_cer") {
                ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(cx - 12, cy + 15); ctx.lineTo(cx - 12, cy + 80); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + 12, cy + 15); ctx.lineTo(cx + 12, cy + 80); ctx.stroke();
                ctx.fillStyle = "#d97706"; ctx.beginPath(); ctx.arc(cx, cy - 10, 36, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#000"; ctx.font = "bold 15px monospace"; ctx.fillText("104", cx - 14, cy - 6);
            } else if (type === "ic") {
                ctx.fillStyle = "#111827"; ctx.beginPath(); ctx.roundRect(cx - 65, cy - 40, 130, 80, 5); ctx.fill();
                ctx.fillStyle = "#cbd5e1";
                for (let i = 0; i < 4; i++) {
                    const px = cx - 48 + i * 32;
                    ctx.fillRect(px, cy - 52, 12, 14);
                    ctx.fillRect(px, cy + 38, 12, 14);
                }
                ctx.fillStyle = "#fff"; ctx.font = "bold 14px monospace"; ctx.fillText("NE555", cx - 22, cy + 5);
            }
        }

        function switchMobilePart(key) {
            curKey = key;
            const item = M_DATA[key];
            if (!item) return;

            if (!isRealCam) drawMobileCanvas(item.type);

            document.getElementById("mConfBadge").textContent = "CONFIDENCE " + item.conf;
            document.getElementById("mPartName").textContent = item.name;
            document.getElementById("mPartDesc").textContent = item.desc;
            document.getElementById("mDrawerId").textContent = item.box;
            document.getElementById("mVoiceHint").textContent = `🔊 語音：「請放入 ${item.box[0]} 區 ${parseInt(item.box.slice(2))} 號盒」`;

            document.querySelectorAll(".mini-cell").forEach(el => el.classList.remove("active-drawer"));
            const target = document.getElementById("m-cell-" + item.box);
            if (target) target.classList.add("active-drawer");
        }

        function triggerMobileScan() {
            const item = M_DATA[curKey];
            if (!item) return;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(item.speech);
                utter.lang = 'zh-TW';
                utter.rate = 1.0;
                window.speechSynthesis.speak(utter);
            }
        }

        async function toggleRealCam() {
            const vid = document.getElementById("mobileVideo");
            const cvs = document.getElementById("simCanvas");

            if (!isRealCam) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                    vid.srcObject = stream;
                    vid.style.display = "block";
                    cvs.style.display = "none";
                    isRealCam = true;
                } catch (e) {
                    alert("無法啟動相機 (請確保在 HTTPS 環境或允許鏡頭權限)：" + e.message);
                }
            } else {
                if (vid.srcObject) {
                    vid.srcObject.getTracks().forEach(t => t.stop());
                }
                vid.style.display = "none";
                cvs.style.display = "block";
                isRealCam = false;
                drawMobileCanvas(M_DATA[curKey].type);
            }
        }

        window.onload = function() {
            initMiniGrid();
            switchMobilePart("resistor_10k");
        };
    </script>
</body>
</html>
