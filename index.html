<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 確保行動裝置不會亂縮放影響截圖 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>青年百億圓夢基金計畫 - 申請書系統</title>
    <!-- Tailwind CSS (僅限左側 UI 使用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入最底層的 jsPDF 與 html2canvas，確保排版與截圖的絕對控制權 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

        .form-input {
            width: 100%; border-radius: 0.375rem; border: 1px solid #cbd5e1; padding: 0.5rem;
            font-size: 0.875rem; background-color: #f8fafc; transition: all 0.2s; box-sizing: border-box;
        }
        .form-input:focus { outline: none; border-color: #4f46e5; background-color: #ffffff; box-shadow: 0 0 0 2px #c7d2fe; }

        /* ================================================================= */
        /* 預覽與轉檔共用的 A4 嚴格樣式，使用 px 固定尺寸避免 dpi 縮放問題 */
        /* A4 比例: 794px * 1123px (大約是 96dpi 下的尺寸) */
        /* ================================================================= */
        #ui-preview-pane {
            background-color: #cbd5e1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 2rem;
        }

        .doc-page {
            font-family: 'DFKai-SB', 'BiauKai', '標楷體', serif !important;
            font-size: 14pt; line-height: 1.5; color: black; text-align: left;
            background: white; 
            width: 794px; /* 固定像素，避免手機端截圖被裁切 */
            min-height: 1123px;
            padding: 75px 94px; /* 模擬 2cm 2.5cm */
            box-sizing: border-box;
            position: relative;
        }
        
        .preview-shadow { box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        .doc-page table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 14pt; }
        .doc-page th, .doc-page td { border: 1px solid black; padding: 6px; vertical-align: middle; text-align: center; }
        .doc-page .no-border td { border: none !important; text-align: left; }
        .doc-page p { margin: 0 0 8px 0; padding: 0; }

        /* 絕對隱藏區，解決轉檔空白問題，強制定位在左上角避免捲動誤差 */
        #hidden-export-zone {
            position: absolute; top: 0; left: 0; z-index: -10; background: white; visibility: hidden; width: 794px;
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col md:flex-row relative">

    <!-- 全域資料與圖片快取 -->
    <script>
        window.DocData = {
            name: '', id: '', birth: '', phone: '', address: '', email: '',
            em_name: '', em_relation: '', em_phone: '',
            g_name: '', g_relation: '', g_id: '', g_phone: '', g_address: '',
            project_name: '', content_1: '', content_2: '', content_3: '', content_4: '', content_5: '', content_6: '',
            funding: 'agree', isGuardian: false,
            img_front: null, img_back: null, sig_app: null, sig_gua: null,
            todayY: new Date().getFullYear() - 1911, todayM: new Date().getMonth() + 1, todayD: new Date().getDate()
        };
    </script>

    <!-- ================= 左側：資料輸入 ================= -->
    <div class="w-full md:w-5/12 lg:w-1/3 h-full bg-white shadow-2xl flex flex-col z-20 border-r border-gray-200">
        <div class="p-4 bg-indigo-700 text-white flex justify-between items-center shrink-0">
            <h1 class="text-lg font-bold">計畫申請書系統</h1>
            <span class="text-xs bg-indigo-500 px-2 py-1 rounded shadow">防裁切絕不跑版</span>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-5" id="form-container">
            <!-- 1. 基本資料 -->
            <div class="border rounded-lg p-4 bg-gray-50">
                <h2 class="font-bold text-gray-800 mb-3 border-b pb-2">1. 申請人資料</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs mb-1">姓名</label><input type="text" id="i_name" class="form-input"></div>
                    <div><label class="block text-xs mb-1">身分證字號</label><input type="text" id="i_id" class="form-input"></div>
                    <div><label class="block text-xs mb-1">出生年月日</label><input type="date" id="i_birth" class="form-input"></div>
                    <div><label class="block text-xs mb-1">手機號碼</label><input type="tel" id="i_phone" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs mb-1">Email</label><input type="email" id="i_email" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs mb-1">戶籍地址</label><input type="text" id="i_address" class="form-input"></div>
                </div>
                <div class="mt-3 pt-3 border-t">
                    <label class="block text-xs font-bold mb-2">緊急連絡人</label>
                    <div class="grid grid-cols-2 gap-3">
                        <div><input type="text" id="i_em_name" class="form-input" placeholder="姓名"></div>
                        <div><input type="text" id="i_em_relation" class="form-input" placeholder="關係"></div>
                        <div class="col-span-2"><input type="tel" id="i_em_phone" class="form-input" placeholder="連絡電話"></div>
                    </div>
                </div>
            </div>

            <!-- 2. 法定代理人 -->
            <div class="border rounded-lg p-4 bg-gray-50">
                <div class="flex justify-between items-center border-b pb-2 mb-3">
                    <h2 class="font-bold text-gray-800 text-sm">2. 法定代理人 (未成年)</h2>
                    <input type="checkbox" id="i_is_guardian" class="w-5 h-5 cursor-pointer">
                </div>
                <div id="box_guardian" class="hidden grid-cols-2 gap-3 pt-2">
                    <div><label class="block text-xs mb-1">姓名</label><input type="text" id="i_g_name" class="form-input"></div>
                    <div><label class="block text-xs mb-1">關係</label><input type="text" id="i_g_relation" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs mb-1">身分證字號</label><input type="text" id="i_g_id" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs mb-1">聯絡電話</label><input type="tel" id="i_g_phone" class="form-input"></div>
                    <div class="col-span-2"><label class="block text-xs mb-1">聯絡地址</label><input type="text" id="i_g_address" class="form-input"></div>
                </div>
            </div>

            <!-- 3. 計畫資訊與圖片 -->
            <div class="border rounded-lg p-4 bg-gray-50">
                <h2 class="font-bold text-gray-800 mb-3 border-b pb-2 text-sm">3. 計畫與證件</h2>
                <div class="space-y-3">
                    <div><label class="block text-xs mb-1">計畫名稱與編號</label><input type="text" id="i_project_name" class="form-input"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs mb-1">身分證正面</label><input type="file" id="file_front" accept="image/*" class="text-xs w-full"></div>
                        <div><label class="block text-xs mb-1">身分證反面</label><input type="file" id="file_back" accept="image/*" class="text-xs w-full"></div>
                    </div>
                </div>
            </div>

            <!-- 4. 內文 -->
            <div class="border rounded-lg p-4 bg-gray-50">
                <h2 class="font-bold text-gray-800 mb-3 border-b pb-2 text-sm">4. 申請書內文</h2>
                <div class="space-y-3">
                    <div><label class="block text-xs font-bold mb-1">1. 學經歷</label><textarea id="i_content_1" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-xs font-bold mb-1">2. 對計畫了解</label><textarea id="i_content_2" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-xs font-bold mb-1">3. 動機及期待</label><textarea id="i_content_3" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-xs font-bold mb-1">4. 未來規劃及影響</label><textarea id="i_content_4" rows="2" class="form-input"></textarea></div>
                    <div class="bg-white p-2 rounded border">
                        <label class="block text-xs font-bold mb-1">5. 經費需求同意書</label>
                        <div class="flex gap-4 text-sm">
                            <label><input type="radio" name="i_funding" value="agree" checked> 同意</label>
                            <label><input type="radio" name="i_funding" value="disagree"> 不同意</label>
                        </div>
                    </div>
                    <div><label class="block text-xs font-bold mb-1">6. 外語證明 (選填)</label><textarea id="i_content_5" rows="2" class="form-input"></textarea></div>
                    <div><label class="block text-xs font-bold mb-1">7. 其他證明 (選填)</label><textarea id="i_content_6" rows="2" class="form-input"></textarea></div>
                </div>
            </div>

            <!-- 5. 簽名 -->
            <div class="border rounded-lg p-4 bg-gray-50 pb-8">
                <h2 class="font-bold text-gray-800 mb-3 border-b pb-2 text-sm">5. 智慧簽章</h2>
                <div class="space-y-4">
                    <div class="bg-white p-3 rounded border flex items-center gap-4 shadow-sm">
                        <div id="qr_app" class="w-[80px] h-[80px] bg-gray-100 flex items-center justify-center border text-xs text-gray-400">QRCode</div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm">申請人簽章</h3>
                            <button onclick="openSignPad('app')" class="mt-2 text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded hover:bg-indigo-200 w-full text-center">本機滑鼠/觸控簽名</button>
                            <span id="ok_app" class="text-xs text-green-600 font-bold hidden block mt-1">✅ 已簽名</span>
                        </div>
                    </div>
                    <div id="box_sign_gua" class="hidden bg-white p-3 rounded border flex items-center gap-4 shadow-sm">
                        <div id="qr_gua" class="w-[80px] h-[80px] bg-gray-100 flex items-center justify-center border text-xs text-gray-400">QRCode</div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm">法代簽章</h3>
                            <button onclick="openSignPad('gua')" class="mt-2 text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-2 rounded hover:bg-indigo-200 w-full text-center">本機滑鼠/觸控簽名</button>
                            <span id="ok_gua" class="text-xs text-green-600 font-bold hidden block mt-1">✅ 已簽名</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 輸出按鈕 (PDF 變更狀態文字，防止連按) -->
        <div class="p-4 bg-white border-t flex gap-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] shrink-0 z-30">
            <button id="btn-export-word" onclick="ExportCore.toWord()" class="flex-1 bg-white border-2 border-indigo-600 text-indigo-700 font-bold py-3 rounded-lg hover:bg-indigo-50 transition">📥 匯出 Word</button>
            <button id="btn-export-pdf" onclick="ExportCore.toPDF()" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md flex justify-center items-center gap-2">
                <span>📥 匯出 PDF</span>
            </button>
        </div>
    </div>

    <!-- ================= 右側：UI 預覽區 ================= -->
    <div class="w-full md:w-7/12 lg:w-2/3 h-full" id="ui-preview-pane">
        <!-- 內容由 JS 自動更新 -->
    </div>

    <!-- ================= 隱藏背景：轉檔專用區 (強制固定寬高防裁切) ================= -->
    <div id="hidden-export-zone"></div>

    <!-- ================= 畫布彈出視窗 (強制設定大小，確保觸控正常) ================= -->
    <div id="sign_modal" class="hidden fixed inset-0 bg-black/60 z-[9999] flex items-center justify-center p-4">
        <div class="bg-white rounded-lg w-full max-w-lg flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-indigo-600 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold" id="sign_title">請簽名</h3>
                <button onclick="closeSignPad()" class="text-white font-bold text-xl hover:text-gray-200">&times;</button>
            </div>
            <div class="p-4 bg-gray-50">
                <div id="canvas_wrap" class="w-full h-[300px] bg-white border-2 border-dashed border-gray-400 rounded relative">
                    <canvas id="sign_canvas" class="absolute inset-0 w-full h-full touch-none z-10 cursor-crosshair"></canvas>
                    <div class="absolute inset-0 flex items-center justify-center text-gray-200 text-3xl font-bold -rotate-12 select-none z-0">簽名區</div>
                </div>
            </div>
            <div class="px-4 py-3 bg-white border-t flex gap-3">
                <button onclick="clearSignPad()" class="flex-1 py-2 bg-gray-200 font-bold text-gray-700 rounded hover:bg-gray-300">清除重寫</button>
                <button onclick="saveSignPad()" class="flex-[2] py-2 bg-indigo-600 font-bold text-white rounded hover:bg-indigo-700 shadow">確認儲存</button>
            </div>
        </div>
    </div>

    <!-- ================= 核心 JavaScript ================= -->
    <script>
        // ---------------- 1. 事件與資料綁定 ----------------
        const keys = ['name', 'id', 'birth', 'phone', 'address', 'email', 'em_name', 'em_relation', 'em_phone', 'g_name', 'g_relation', 'g_id', 'g_phone', 'g_address', 'project_name', 'content_1', 'content_2', 'content_3', 'content_4', 'content_5', 'content_6'];
        
        keys.forEach(k => {
            document.getElementById(`i_${k}`)?.addEventListener('input', e => {
                window.DocData[k] = e.target.value;
                RenderEngine.updateUI();
            });
        });

        document.getElementById('i_is_guardian').addEventListener('change', e => {
            window.DocData.isGuardian = e.target.checked;
            document.getElementById('box_guardian').style.display = e.target.checked ? 'grid' : 'none';
            document.getElementById('box_sign_gua').style.display = e.target.checked ? 'flex' : 'none';
            RenderEngine.updateUI();
        });

        document.querySelectorAll('input[name="i_funding"]').forEach(el => {
            el.addEventListener('change', e => { window.DocData.funding = e.target.value; RenderEngine.updateUI(); });
        });

        function bindFile(id, key) {
            document.getElementById(id).addEventListener('change', e => {
                const file = e.target.files[0];
                if(file){
                    const r = new FileReader();
                    r.onload = ev => { window.DocData[key] = ev.target.result; RenderEngine.updateUI(); };
                    r.readAsDataURL(file);
                }
            });
        }
        bindFile('file_front', 'img_front');
        bindFile('file_back', 'img_back');

        // ---------------- 2. 嚴格 HTML 生成引擎 ----------------
        const RenderEngine = {
            getV: (k) => window.DocData[k] || '&nbsp;',
            getH: (k) => window.DocData[k] ? window.DocData[k].replace(/\n/g, '<br>') : '&nbsp;',
            getI: (k, t) => window.DocData[k] ? `<img src="${window.DocData[k]}" style="max-height:160px; max-width:100%; object-fit:contain;" />` : `<span style="color:#999;">${t}</span>`,
            getS: (k) => window.DocData[k] ? `<img src="${window.DocData[k]}" style="max-height:35px; width:auto;" />` : `<span style="color:#999;">請親筆簽名</span>`,

            buildPages: function() {
                const d = window.DocData;
                const chkG = d.isGuardian ? '☑' : '&nbsp;&nbsp;';
                const agree = d.funding === 'agree' ? '☑' : '&nbsp;&nbsp;';
                const disagree = d.funding === 'disagree' ? '☑' : '&nbsp;&nbsp;';
                const pages = [];
                
                // 附件1 (保證高度不會超過 A4)
                pages.push(`
                    <div style="text-align: right; font-size: 11pt; margin-bottom: 10px;">附件1</div>
                    <div style="font-size: 18pt; font-weight: bold; text-align: center; margin-bottom: 20px; line-height: 1.5;">教育部青年發展署<br>青年百億海外圓夢基金計畫海外翱翔組<br>申請檢核清單</div>
                    <table border="1">
                        <tr><th style="width: 15%;">檢核(請打勾)</th><th style="width: 35%;">內容</th><th>說明</th></tr>
                        <tr><td>[ &nbsp;&nbsp; ]</td><td>申請資料上傳</td><td style="text-align:left;">請申請人至青年百億海外圓夢基金計畫平臺，登入會員後，填寫相關報名資料。</td></tr>
                        <tr><td>[ &nbsp;&nbsp; ]</td><td colspan="2" style="font-weight: bold;">申請文件請於報名期間以PDF檔分別上傳至青年百億海外圓夢基金計畫平臺報名專區</td></tr>
                        <tr><td>[ &nbsp;&nbsp; ]</td><td>(1)參與切結書（簽名後掃描電子檔）</td><td style="text-align:left;">附件2</td></tr>
                        <tr><td>[ &nbsp;&nbsp; ]</td><td>(2)特殊身分證明文件掃描影本</td><td style="text-align:left;">請檢附相關證明文件。</td></tr>
                        <tr><td>[ ${chkG} ]</td><td>(3)法定代理人同意書</td><td style="text-align:left;">附件3，簽名後掃描電子檔，未成年者務必繳交</td></tr>
                        <tr><td>[ ☑ ]</td><td>(4)計畫申請書（含封面及內文）</td><td style="text-align:left;">附件4、5</td></tr>
                    </table>
                `);

                // 附件2：切結書
                pages.push(`
                    <div style="text-align: right; font-size: 11pt; margin-bottom: 5px;">附件2</div>
                    <div style="font-weight: bold; margin-bottom: 5px; font-size: 11pt;">參與切結書（須親筆簽名提供予青年百億海外圓夢基金計畫專案小組。）</div>
                    <div style="font-size: 16pt; font-weight: bold; text-align: center; margin: 15px 0;">教育部青年發展署<br>青年百億海外圓夢基金計畫海外翱翔組<br>參與切結書</div>
                    <div style="text-indent: 2em; margin-bottom: 10px; font-size: 13pt; text-align: justify; line-height: 1.5;">
                        本人申請教育部青年發展署「115年青年百億海外圓夢基金計畫海外翱翔組」<span style="border-bottom: 1px solid black; padding: 0 5px;">${this.getV('project_name')}</span>提案。本人確定所填資料及相關附件均屬事實，嗣後如經查，發現有不實情事，本人願負一切法律責任，並繳回已領取獎勵金，特此切結，絕無異議。
                    </div>
                    <div style="text-indent: 2em; margin-bottom: 15px; font-size: 13pt; text-align: justify; line-height: 1.5;">
                        另，本人同意於提案計畫審查錄取獲實踐獎勵金後，依教育部青年發展署「115年青年百億海外圓夢基金計畫海外翱翔組」相關規定辦理，參與並完成計畫。
                    </div>
                    <div style="margin-bottom: 15px; font-size: 13pt;">此致<br><span style="padding-left: 2em;">教育部青年發展署</span></div>
                    
                    <table border="1" style="width: 55%; margin: 10px 0 10px auto;">
                        <tr><th style="width: 40%; font-weight: normal;">立切結書人</th><td>${this.getV('name')}</td></tr>
                        <tr><th style="font-weight: normal;">簽章</th><td style="height: 45px;">${this.getS('sig_app')}</td></tr>
                    </table>
                    <div style="text-align: right; margin-bottom: 15px; font-size: 13pt;">中華民國 <span>${d.todayY}</span> 年 <span>${d.todayM}</span> 月 <span>${d.todayD}</span> 日</div>

                    <div style="font-size: 13pt; font-weight: bold; margin-bottom: 5px;">一、申請人資料</div>
                    <table border="1" style="font-size: 12pt;">
                        <tr><th rowspan="2" style="width: 15%; font-weight: normal;">立切結書人</th><th style="font-weight: normal;">姓名</th><th style="font-weight: normal;">身分證字號</th><th style="font-weight: normal;">出生年月日</th><th style="font-weight: normal;">手機號碼</th><th colspan="2" style="font-weight: normal;">戶籍地址</th></tr>
                        <tr><td style="height: 25px;">${this.getV('name')}</td><td>${this.getV('id')}</td><td>${this.getV('birth')}</td><td>${this.getV('phone')}</td><td colspan="2" style="text-align: left;">${this.getV('address')}</td></tr>
                        <tr><th rowspan="2" style="font-weight: normal;">緊急連絡人</th><th style="font-weight: normal;">姓名</th><th style="font-weight: normal;">關係</th><th colspan="4" style="font-weight: normal;">連絡電話</th></tr>
                        <tr><td style="height: 25px;">${this.getV('em_name')}</td><td>${this.getV('em_relation')}</td><td colspan="4">${this.getV('em_phone')}</td></tr>
                    </table>
                    <div style="margin-top: 10px;">申請計畫編號：<span style="border-bottom: 1px solid black; padding: 0 10px;">${this.getV('project_name')}</span></div>
                `);

                // 身分證
                p.push(`
                    <div style="font-weight: bold; font-size: 16pt; margin-bottom: 20px;">二、請提供身分證正反面影本</div>
                    <table border="1">
